name: Temporary TRPG v1.5.7 Repeated Real API E2E

on:
  push:
    branches:
      - tmp/v157-real-api-e2e
    paths:
      - '.github/workflows/v157-real-api-repeat.yml'

permissions:
  contents: read

jobs:
  repeated-real-api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: v1.5.7 deterministic preflight
        run: |
          node trpg-dm-assistant/build/test-v157-case-integrity.js
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          git diff --exit-code -- trpg-dm-assistant/outputs/trpg-dm-assistant.html

      - name: Restore isolated E2E harness
        run: |
          git fetch origin e66901c338d0cc66c9f4619564c99ee92edae6b9 --depth=1
          git show e66901c338d0cc66c9f4619564c99ee92edae6b9:trpg-dm-assistant/build/test-real-api-v157-e2e.js > trpg-dm-assistant/build/test-real-api-v157-e2e.js

      - name: Real DeepSeek v1.5.7 repeated E2E - 5 rounds
        env:
          TRPG_TEST_API_KEY: ${{ secrets.DS_KEY }}
          TRPG_TEST_API_URL: https://api.deepseek.com/chat/completions
          TRPG_TEST_MODEL: deepseek-v4-flash
        run: |
          test -n "$TRPG_TEST_API_KEY"
          for round in 1 2 3 4 5; do
            echo "===== REAL API E2E ROUND $round/5 ====="
            node trpg-dm-assistant/build/test-real-api-v157-e2e.js
          done
