name: TV Browser Lite - Android CI

on:
  push:
    branches: [main]
    paths:
      - "tv-browser-lite/**"
      - ".github/workflows/tv-browser-lite-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tv-browser-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        # GitHub-hosted Ubuntu already includes command-line SDK tools.
        # setup-android@v3 ran obsolete 'sdkmanager tools' and failed
        # before Gradle; avoid that step and install only packages we need.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Test and assemble independent APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: APK checksum
        if: success()
        run: sha256sum app/build/outputs/apk/debug/*.apk
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tv-browser-lite-debug-apk
          path: tv-browser-lite/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
