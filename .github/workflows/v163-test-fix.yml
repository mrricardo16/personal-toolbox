name: Persist v1.6.3 Retry Harness Fix

on:
  push:
    branches:
      - agent/v1.6.3-san-loss-resolution

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Persist v1.6.3 retry harness fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch retry helper
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const file='trpg-dm-assistant/build/test-v163-san-loss-resolution.js';
          let s=fs.readFileSync(file,'utf8');
          const helper='async function __continuation(record){state.checkRecords.push(record);const beforeSan=state.character.san;await requestContinuation(record,{secret:false});return{record:deepClone(record),beforeSan,afterSan:state.character.san,calls:globalThis.__v163StructuredCalls,state:deepClone(state)}}\n';
          const helperNext=helper+'async function __repeatContinuation(recordId){const record=state.checkRecords.find(x=>x.id===recordId);if(!record)throw new Error("record not found");await requestContinuation(record,{secret:false});return{record:deepClone(record),calls:globalThis.__v163StructuredCalls,state:deepClone(state)}}\n';
          if(!s.includes(helper))throw new Error('continuation helper not found');
          s=s.replace(helper,helperNext);
          s=s.replace('continuation:__continuation,structuredCalls:__structuredCalls','continuation:__continuation,repeatContinuation:__repeatContinuation,structuredCalls:__structuredCalls');
          const old='await sandbox.requestContinuation(sandbox.state.checkRecords.find(x=>x.id==="retry-san"),{secret:false});const live=sandbox.state.checkRecords.find(x=>x.id==="retry-san");assert.equal(JSON.stringify(live.sanResolution),snapshot);assert.equal(api.structuredCalls(),beforeCalls+1)';
          const next='const second=await api.repeatContinuation("retry-san");assert.equal(JSON.stringify(second.record.sanResolution),snapshot);assert.equal(api.structuredCalls(),beforeCalls+1)';
          if(!s.includes(old))throw new Error('retry test target not found');
          s=s.replace(old,next);
          fs.writeFileSync(file,s,'utf8');
          NODE
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/build/test-v163-san-loss-resolution.js
          git commit -m "Fix v1.6.3 retry harness access"
          git push origin HEAD:agent/v1.6.3-san-loss-resolution
