name: Finalize TRPG v1.5.7 docs

on:
  push:
    branches: [agent/v1.5.7-case-integrity]
    paths:
      - '.github/workflows/v157-validate.yml'
      - 'trpg-dm-assistant/build/finalize-v157-readme.js'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.5.7-case-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch README
        run: node trpg-dm-assistant/build/finalize-v157-readme.js
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/README.md
          git diff --cached --check
          git commit -m "Document TRPG DM Assistant v1.5.7"
          git push origin HEAD:agent/v1.5.7-case-integrity
