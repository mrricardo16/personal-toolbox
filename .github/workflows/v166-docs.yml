name: Finalize TRPG v1.6.6 Documentation

on:
  push:
    branches:
      - agent/v1.6.6-health-stabilization

permissions:
  contents: write

jobs:
  docs:
    if: github.event.head_commit.message == 'Run v1.6.6 documentation finalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        run: python3 trpg-dm-assistant/build/patch-v166-readme.py
      - name: Validate documentation
        shell: bash
        run: |
          grep -q 'TRPG AI 主持助手 v1.6.6' trpg-dm-assistant/README.md
          grep -q '714 PASS / 0 FAIL' trpg-dm-assistant/README.md
          grep -q '31568850359' trpg-dm-assistant/README.md
          grep -q '582277 bytes' trpg-dm-assistant/README.md
          test -f trpg-dm-assistant/reports/trpg-dm-assistant-v1.6.6-test-report.md
          git diff --check
      - name: Persist documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trpg-dm-assistant/README.md
          git commit -m 'Document TRPG DM Assistant v1.6.6'
          git push origin HEAD:agent/v1.6.6-health-stabilization
