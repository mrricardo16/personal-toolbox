name: TRPG v1.6.9 Development Gate

on:
  push:
    branches: [agent/v1.6.9-combat-damage]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip v169-dev]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check trpg-dm-assistant/src/combat-damage.js
          node --check trpg-dm-assistant/build/test-v169-combat-damage.js
      - name: v1.6.9 focused regression
        run: node trpg-dm-assistant/build/test-v169-combat-damage.js
      - name: v1.6.8 compatibility regression
        run: node trpg-dm-assistant/build/test-v168-combat-opposed.js
      - name: Build and verify
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          git diff --check
      - name: Persist deterministic product
        run: |
          if ! git diff --quiet -- trpg-dm-assistant/outputs/trpg-dm-assistant.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trpg-dm-assistant/outputs/trpg-dm-assistant.html
            git commit -m "Build v1.6.9 combat damage product [skip v169-dev]"
            git push
          fi
