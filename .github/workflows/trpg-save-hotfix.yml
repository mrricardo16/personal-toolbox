name: One-shot TRPG save controls hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trpg-save-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Patch structured source
        run: |
          python3 .github/scripts/trpg-save-hotfix.py
          python3 .github/scripts/trpg-save-hotfix-test-fix.py

      - name: Runtime security and protocol tests
        run: node trpg-dm-assistant/build/test-security-hardening.js

      - name: Save management interaction regression
        run: node trpg-dm-assistant/build/test-save-ui.js

      - name: JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)

      - name: Build and verify
        shell: bash
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          test "$(find trpg-dm-assistant -type f -name '*.html' | wc -l)" -eq 1
          git diff --check

      - name: Commit to main
        shell: bash
        run: |
          rm .github/workflows/trpg-save-hotfix.yml
          rm .github/scripts/trpg-save-hotfix.py
          rm .github/scripts/trpg-save-hotfix-test-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix TRPG save management controls'
          git push origin HEAD:main
