name: Update TRPG v1.5.13 Report Evidence

on:
  push:
    branches:
      - agent/v1.5.13-full-case-e2e

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record clean-head permanent CI evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('trpg-dm-assistant/reports/trpg-dm-assistant-v1.5.13-test-report.md')
          text=p.read_text(encoding='utf-8')
          old='At report creation time, live current-runtime DeepSeek validation has passed twice and the formal source has been persisted. Clean PR-head permanent CI is still pending.'
          new='Clean PR-head permanent CI Run `31356432365` on head `9bb634c2dd262dc472c4b4a3ec34d0da5ad8262f` completed successfully: the full **458 PASS / 0 FAIL** deterministic suite, JavaScript syntax, deterministic single-HTML build, and verifier all passed. Because this evidence update changes only the report file and therefore creates a new final head, that final report-only head must receive one additional permanent CI run before merge.'
          if old in text:
              text=text.replace(old,new)
          if new not in text:
              raise SystemExit('report evidence patch failed')
          p.write_text(text,encoding='utf-8')
          PY

      - name: Verify release state
        shell: bash
        run: |
          node trpg-dm-assistant/build/test-v1513-full-case-e2e.js
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          git diff --exit-code -- trpg-dm-assistant/outputs/trpg-dm-assistant.html
          git diff --check

      - name: Commit report evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/reports/trpg-dm-assistant-v1.5.13-test-report.md
          if git diff --cached --quiet; then
            echo "Report evidence already synchronized"
          else
            git commit -m "Record v1.5.13 clean-head CI evidence"
            git push origin HEAD:agent/v1.5.13-full-case-e2e
          fi
