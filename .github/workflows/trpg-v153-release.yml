name: One-shot TRPG v1.5.3 docs finalize

on:
  push:
    branches:
      - tmp-v153-clue-route-hotfix
    paths:
      - '.github/workflows/trpg-v153-release.yml'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v153-clue-route-hotfix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Finalize release docs
        run: node .github/scripts/trpg-v153-finalize.js
      - name: Verify release state
        shell: bash
        run: |
          node trpg-dm-assistant/build/test-v153-clue-routes.js
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          git diff --exit-code -- trpg-dm-assistant/outputs/trpg-dm-assistant.html
          git diff --check
      - name: Commit release docs only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md trpg-dm-assistant/README.md trpg-dm-assistant/reports/v1.5.3-test-report.md
          git diff --cached --check
          git commit -m "Document TRPG DM Assistant v1.5.3"
          git push origin HEAD:tmp-v153-clue-route-hotfix
