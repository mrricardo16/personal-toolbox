name: Validate TRPG v1.6.4 Indefinite Insanity Window Release

on:
  push:
    branches:
      - agent/v1.6.4-indefinite-insanity-window

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Run v1.6.4 release gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare v1.6.4 release identity
        run: node trpg-dm-assistant/build/patch-v164-release.js
      - name: v1.6.4 indefinite insanity window
        run: node trpg-dm-assistant/build/test-v164-indefinite-insanity-window.js
      - name: Full permanent deterministic regressions
        shell: bash
        run: |
          set -euo pipefail
          for file in trpg-dm-assistant/build/test-*.js; do
            case "$(basename "$file")" in
              test-real-api-*.js|test-v164-indefinite-insanity-window.js) continue ;;
            esac
            node "$file"
          done
      - name: JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)
      - name: Build and verify
        shell: bash
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          test "$(find trpg-dm-assistant -type f -name '*.html' | wc -l)" -eq 1
          git diff --check
      - name: Real DeepSeek v1.6.4 current-runtime E2E
        env:
          TRPG_TEST_API_KEY: ${{ secrets.DS_KEY }}
          TRPG_TEST_API_URL: https://api.deepseek.com/v1/chat/completions
          TRPG_TEST_MODEL: deepseek-v4-flash
        run: |
          test -n "$TRPG_TEST_API_KEY"
          node trpg-dm-assistant/build/test-real-api-v1513.js
      - name: Persist validated v1.6.4 release files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/src/scenarios/library.js \
                  trpg-dm-assistant/build/test-real-api-v1513.js \
                  trpg-dm-assistant/outputs/trpg-dm-assistant.html
          if git diff --cached --quiet; then
            echo "Validated v1.6.4 release files already synchronized"
          else
            git commit -m "Finalize TRPG DM Assistant v1.6.4 indefinite insanity window"
            git push origin HEAD:agent/v1.6.4-indefinite-insanity-window
          fi
