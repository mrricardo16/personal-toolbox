name: Temporary TRPG v1.5.7 Canonical Assertion Hotfix Validation

on:
  push:
    branches:
      - fix/v157-canonical-assertion-boundary
    paths:
      - '.github/workflows/v157-canonical-hotfix-validate.yml'

permissions:
  contents: write

jobs:
  validate-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v157-canonical-assertion-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deterministic hotfix regression
        run: |
          node trpg-dm-assistant/build/test-v156-player-assertion-guard.js
          node trpg-dm-assistant/build/test-v157-case-integrity.js
          node trpg-dm-assistant/build/test-v157-canonical-assertion-state.js
          node --check trpg-dm-assistant/src/interaction-availability.js
          node --check trpg-dm-assistant/build/test-v157-canonical-assertion-state.js

      - name: Build and verify hotfix
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          git diff --check

      - name: Restore isolated real API harness
        run: |
          git fetch origin e66901c338d0cc66c9f4619564c99ee92edae6b9 --depth=1
          git show e66901c338d0cc66c9f4619564c99ee92edae6b9:trpg-dm-assistant/build/test-real-api-v157-e2e.js > trpg-dm-assistant/build/test-real-api-v157-e2e.js

      - name: Real DeepSeek hotfix E2E - 5 rounds
        env:
          TRPG_TEST_API_KEY: ${{ secrets.DS_KEY }}
          TRPG_TEST_API_URL: https://api.deepseek.com/chat/completions
          TRPG_TEST_MODEL: deepseek-v4-flash
        run: |
          test -n "$TRPG_TEST_API_KEY"
          for round in 1 2 3 4 5; do
            echo "===== HOTFIX REAL API E2E ROUND $round/5 ====="
            node trpg-dm-assistant/build/test-real-api-v157-e2e.js
          done

      - name: Commit rebuilt product
        run: |
          rm -f trpg-dm-assistant/build/test-real-api-v157-e2e.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/outputs/trpg-dm-assistant.html
          if git diff --cached --quiet; then
            echo "Product already synchronized"
          else
            git commit -m "Rebuild TRPG product for canonical assertion hotfix"
            git push origin HEAD:fix/v157-canonical-assertion-boundary
          fi
