name: TRPG v1.6.7 Release Gate

on:
  push:
    branches: [agent/v1.6.7-healing-recovery]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.7-healing-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply formal v1.6.7 release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'trpg-dm-assistant/src/scenarios/library.js',
              'const APP_VERSION = "1.6.6";',
              'const APP_VERSION = "1.6.7";'
          )

          replace_once(
              'trpg-dm-assistant/build/test-v166-health-stabilization.js',
              'assert.equal(api.APP_VERSION,"1.6.6");',
              '{const [major,minor,patch]=api.APP_VERSION.split(".").map(Number);assert(major>1||(major===1&&(minor>6||(minor===6&&patch>=6))),`unexpected forward version ${api.APP_VERSION}`)};'
          )

          replace_once(
              'trpg-dm-assistant/build/test-v167-healing-recovery.js',
              'await test("v1.6.7 Healing Recovery 模块加载",async()=>{assert.equal(api.HEALING_RECOVERY_VERSION,"1.0");',
              'await test("v1.6.7 Healing Recovery 模块加载",async()=>{assert.equal(api.APP_VERSION,"1.6.7");assert.equal(api.HEALING_RECOVERY_VERSION,"1.0");'
          )

          replace_once(
              'trpg-dm-assistant/build/test-real-api-v1513.js',
              '"hp-damage-state.js","health-stabilization.js"]',
              '"hp-damage-state.js","health-stabilization.js","healing-recovery.js"]'
          )
          replace_once(
              'trpg-dm-assistant/build/test-real-api-v1513.js',
              'HP_DAMAGE_STATE_VERSION,HEALTH_STABILIZATION_VERSION,ready:',
              'HP_DAMAGE_STATE_VERSION,HEALTH_STABILIZATION_VERSION,HEALING_RECOVERY_VERSION,ready:'
          )
          replace_once(
              'trpg-dm-assistant/build/test-real-api-v1513.js',
              'assert.equal(api.APP_VERSION,"1.6.6");',
              'assert.equal(api.APP_VERSION,"1.6.7");'
          )
          replace_once(
              'trpg-dm-assistant/build/test-real-api-v1513.js',
              'assert.equal(api.HEALTH_STABILIZATION_VERSION,"1.0");assert.equal(api.HEALTH_STABILIZATION_VERSION,"1.0");',
              'assert.equal(api.HEALTH_STABILIZATION_VERSION,"1.0");assert.equal(api.HEALING_RECOVERY_VERSION,"1.0");'
          )
          PY

      - name: v1.6.7 focused deterministic
        run: node trpg-dm-assistant/build/test-v167-healing-recovery.js

      - name: Full permanent deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          grep -oE 'node trpg-dm-assistant/build/test-[^[:space:]]+\.js' .github/workflows/trpg-ci.yml | while IFS= read -r cmd; do
            echo "> $cmd"
            eval "$cmd"
          done

      - name: JavaScript syntax and deterministic product
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          git diff --check

      - name: Real DeepSeek current-runtime full-case E2E
        env:
          TRPG_TEST_API_KEY: ${{ secrets.DS_KEY }}
          TRPG_TEST_API_URL: https://api.deepseek.com/v1/chat/completions
          TRPG_TEST_MODEL: deepseek-v4-flash
        run: |
          set -euo pipefail
          test -n "$TRPG_TEST_API_KEY"
          node trpg-dm-assistant/build/test-real-api-v1513.js

      - name: Persist formal release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            trpg-dm-assistant/src/scenarios/library.js \
            trpg-dm-assistant/build/test-v166-health-stabilization.js \
            trpg-dm-assistant/build/test-v167-healing-recovery.js \
            trpg-dm-assistant/build/test-real-api-v1513.js \
            trpg-dm-assistant/outputs/trpg-dm-assistant.html
          if git diff --cached --quiet; then
            echo 'Release files already current.'
            exit 0
          fi
          git commit -m 'Finalize TRPG v1.6.7 release identity'
          git push origin HEAD:agent/v1.6.7-healing-recovery
