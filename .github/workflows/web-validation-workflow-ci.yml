name: Web Validation Workflow CI

on:
  push:
    paths:
      - "web-validation-workflow/**"
      - ".github/workflows/web-validation-workflow-ci.yml"
  pull_request:
    paths:
      - "web-validation-workflow/**"
      - ".github/workflows/web-validation-workflow-ci.yml"

jobs:
  test-fixtures-only:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-validation-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-validation-workflow/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
