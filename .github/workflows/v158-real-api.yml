name: Temporary TRPG v1.5.8 Real API Resilience E2E

on:
  push:
    branches:
      - agent/v1.5.8-api-response-resilience
    paths:
      - '.github/workflows/v158-real-api.yml'
      - 'trpg-dm-assistant/build/test-real-api-v158-e2e.js'

permissions:
  contents: read

jobs:
  real-api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Final-head deterministic preflight
        run: |
          echo "Validating final v1.5.8 release head before real API calls"
          node trpg-dm-assistant/build/test-v158-api-response-resilience.js
          node trpg-dm-assistant/build/verify-single-html.js
      - name: Real DeepSeek v1.5.8 E2E - 5 rounds / 15 actions
        env:
          TRPG_TEST_API_KEY: ${{ secrets.DS_KEY }}
          TRPG_TEST_API_URL: https://api.deepseek.com/chat/completions
          TRPG_TEST_MODEL: deepseek-v4-flash
        shell: bash
        run: |
          test -n "$TRPG_TEST_API_KEY"
          for round in 1 2 3 4 5; do
            echo "===== V1.5.8 FINAL-HEAD REAL API ROUND $round/5 ====="
            node trpg-dm-assistant/build/test-real-api-v158-e2e.js
          done
