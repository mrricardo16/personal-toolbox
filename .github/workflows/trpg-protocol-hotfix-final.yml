name: TRPG protocol hotfix finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trpg-protocol-hotfix-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reuse validated source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/trpg-protocol-hotfix.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PY', start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'trpg-protocol-hotfix.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install valid regression test and update verifier
        shell: bash
        run: |
          sed -i 's/const APP_VERSION = \"1\.4\.2\";/const APP_VERSION = \"1.4.3\";/g; s/输出版本号不是 1\.4\.2/输出版本号不是 1.4.3/g' trpg-dm-assistant/build/verify-single-html.js
          cat > trpg-dm-assistant/build/test-protocol-stability.js <<'JS'
          "use strict";
          const fs=require("fs"),assert=require("assert"),path=require("path");
          const source=fs.readFileSync(path.join(__dirname,"../src/ai-protocol.js"),"utf8");
          assert.match(source,/obj=normalizeAiProtocolShape\(obj,\{stage\}\)/);
          assert.match(source,/rawCheck\.required=true/);
          assert.match(source,/\[key,"by","delta"\]/);
          assert.match(source,/payload=\{protocolVersion:AI_PROTOCOL_VERSION/);
          const normalize=value=>String(value??"").trim().split(".").slice(0,2).map(Number).join(".");
          assert.equal(normalize(1.3),"1.3");
          assert.equal(normalize("1.3.0"),"1.3");
          const check={type:"skill",skillId:"spot_hidden"};
          const decision="check";
          if(decision==="check")check.required=true;
          assert.equal(check.required,true);
          const change={operation:"advanceClock",by:1};
          if(change.amount===undefined&&Number.isFinite(Number(change.by)))change.amount=Number(change.by);
          assert.equal(change.amount,1);
          console.log("Protocol stability tests passed");
          JS
          node trpg-dm-assistant/build/test-protocol-stability.js

      - name: Check syntax, build and verify
        shell: bash
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          test "$(find trpg-dm-assistant -type f -name '*.html' | wc -l)" -eq 1
          git diff --check

      - name: Commit v1.4.3 to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trpg-dm-assistant/src trpg-dm-assistant/build trpg-dm-assistant/outputs/trpg-dm-assistant.html trpg-dm-assistant/README.md trpg-dm-assistant/v1.4.3-test-report.md
          git commit -m 'Fix TRPG AI protocol stability v1.4.3'
          git push origin HEAD:main
