name: TRPG v1.4.4 strict hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trpg-v1.4.4-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply v1.4.4 strict hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('trpg-dm-assistant')

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, text):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'无法定位 {label}')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              a = text.find(start)
              b = text.find(end, a + len(start))
              if a < 0 or b < 0:
                  raise RuntimeError(f'无法定位 {label}')
              return text[:a] + replacement.rstrip() + '\n' + text[b:]

          # 1) 版本、存储键和安全上限
          library_path = ROOT / 'src/scenarios/library.js'
          library = read(library_path)
          library = replace_once(library, 'const APP_VERSION = "1.4.3";', 'const APP_VERSION = "1.4.4";', 'APP_VERSION')
          library = replace_once(
              library,
              'const STORAGE_API_KEY = "trpg-dm-assistant:api-key";\nconst STORAGE_PREFS_KEY = "trpg-dm-assistant:prefs:v1";',
              'const STORAGE_API_KEY_PREFIX = "trpg-dm-assistant:api-key:";\nconst STORAGE_API_KEY_LEGACY = "trpg-dm-assistant:api-key";\nconst STORAGE_PREFS_KEY = "trpg-dm-assistant:prefs:v2";',
              'API Key 存储常量'
          )
          library = replace_once(
              library,
              'const RECOMMENDED_TEMPERATURE = 0.45;',
              '''const RECOMMENDED_TEMPERATURE = 0.45;
const API_TRANSPORT_CONFIG_KEYS = Object.freeze(["apiUrl","model","temperature","timeoutMs"]);
const MAX_API_RESPONSE_BYTES = 200000;
const MAX_IMPORT_DEPTH = 32;
const MAX_IMPORT_NODES = 50000;
const MAX_IMPORT_STRING_LENGTH = 2000000;
const MAX_IMPORTED_SCENARIO_NODES = 500;
const MAX_IMPORTED_SCENARIO_CLUES = 3000;''',
              '安全限制常量'
          )
          write(library_path, library)

          # 2) 状态层：API URL 策略、主机隔离偏好、枚举规范化
          state_path = ROOT / 'src/state.js'
          state = read(state_path)
          state_helpers = r'''
function normalizeEnum(value){return String(value??"").trim().toLowerCase()}
function normalizeApiUrl(value){
  let url;try{url=new URL(String(value||"").trim())}catch{throw new Error("API 地址不是有效 URL")}
  const local=["localhost","127.0.0.1","::1"].includes(url.hostname);
  if(url.username||url.password)throw new Error("API 地址不得包含用户名或密码");
  if(url.protocol!=="https:"&&!(url.protocol==="http:"&&local))throw new Error("API 地址必须使用 HTTPS；仅 localhost 允许 HTTP");
  url.hash="";return url.toString()
}
function apiStorageHost(apiUrl){return new URL(normalizeApiUrl(apiUrl)).origin.toLowerCase()}
function apiKeyStorageKey(apiUrl){return STORAGE_API_KEY_PREFIX+encodeURIComponent(apiStorageHost(apiUrl))}
function stripApiTransportConfig(config){const source=isPlainObject(config)?deepClone(config):{};for(const key of API_TRANSPORT_CONFIG_KEYS)delete source[key];delete source.apiKey;delete source.persistKey;return source}
function pickApiTransportConfig(config){const source=isPlainObject(config)?config:{};return{apiUrl:normalizeApiUrl(source.apiUrl||DEFAULT_CONFIG.apiUrl),model:normalizeConfiguredModel(source.model||DEFAULT_CONFIG.model),temperature:clamp(Number(source.temperature??RECOMMENDED_TEMPERATURE),0,2),timeoutMs:clamp(Number(source.timeoutMs||DEFAULT_CONFIG.timeoutMs),5000,180000)}}
function readApiPreferences(){try{const raw=APP_LOCAL_STORAGE.getItem(STORAGE_PREFS_KEY);if(!raw)return pickApiTransportConfig(DEFAULT_CONFIG);const parsed=JSON.parse(raw);return pickApiTransportConfig({...DEFAULT_CONFIG,...(isPlainObject(parsed)?parsed:{})})}catch{return pickApiTransportConfig(DEFAULT_CONFIG)}}
function writeApiPreferences(config){const safe=pickApiTransportConfig(config);APP_LOCAL_STORAGE.setItem(STORAGE_PREFS_KEY,JSON.stringify(safe));return safe}
function applyStoredApiPreferences(config){return{...(isPlainObject(config)?config:{}),...readApiPreferences()}}
function hasPersistedApiKey(apiUrl=state?.config?.apiUrl||DEFAULT_CONFIG.apiUrl){try{return Boolean(APP_LOCAL_STORAGE.getItem(apiKeyStorageKey(apiUrl)))}catch{return false}}
function clearApiKeyForUrl(apiUrl){try{const key=apiKeyStorageKey(apiUrl);APP_LOCAL_STORAGE.removeItem(key);APP_SESSION_STORAGE.removeItem(key)}catch{}}
'''
          state = replace_once(
              state,
              'const APP_LOCAL_STORAGE=safeBrowserStorage("localStorage"),APP_SESSION_STORAGE=safeBrowserStorage("sessionStorage");',
              'const APP_LOCAL_STORAGE=safeBrowserStorage("localStorage"),APP_SESSION_STORAGE=safeBrowserStorage("sessionStorage");\n'+state_helpers.strip(),
              'API 状态辅助函数'
          )
          old_location = 'function normalizeLocationEffect(raw){if(raw===null||raw===undefined)return{type:"stay",targetNodeId:null};if(!isPlainObject(raw)||hasDangerousKeys(raw))throw protocolError("LOCATION_EFFECT_INVALID","locationEffect 必须是对象");const type=asString(raw.type,40);if(!["stay","transition_proposal"].includes(type))throw protocolError("LOCATION_EFFECT_INVALID","locationEffect.type 只能是 stay 或 transition_proposal");return{type,targetNodeId:asString(raw.targetNodeId,120)||null}}'
          new_location = 'function normalizeLocationEffect(raw){if(raw===null||raw===undefined)return{type:"stay",targetNodeId:null};if(!isPlainObject(raw)||hasDangerousKeys(raw))throw protocolError("LOCATION_EFFECT_INVALID","locationEffect 必须是对象");const type=normalizeEnum(asString(raw.type,40));if(!["stay","transition_proposal"].includes(type))throw protocolError("LOCATION_EFFECT_INVALID","locationEffect.type 只能是 stay 或 transition_proposal");return{type,targetNodeId:asString(raw.targetNodeId,120).trim()||null}}'
          state = replace_once(state, old_location, new_location, 'locationEffect 枚举规范化')
          state = replace_once(state, 'let apiKeyMemory="";', 'let apiKeyMemory={host:"",value:""};', 'API Key 内存主机绑定')
          write(state_path, state)

          # 3) AI 协议层：主机隔离 Key、响应上限、本地语法修复、枚举规范化
          ai_path = ROOT / 'src/ai-protocol.js'
          ai = read(ai_path)
          key_block = r'''
function getApiKey(apiUrl=state.config.apiUrl){
  const normalized=normalizeApiUrl(apiUrl),host=apiStorageHost(normalized),storageKey=apiKeyStorageKey(normalized);
  if(apiKeyMemory.host===host&&apiKeyMemory.value)return apiKeyMemory.value;
  let value=APP_SESSION_STORAGE.getItem(storageKey)||APP_LOCAL_STORAGE.getItem(storageKey)||"";
  if(!value&&host==="https://api.deepseek.com"){
    const legacy=APP_SESSION_STORAGE.getItem(STORAGE_API_KEY_LEGACY)||APP_LOCAL_STORAGE.getItem(STORAGE_API_KEY_LEGACY)||"";
    if(legacy){value=legacy;APP_SESSION_STORAGE.setItem(storageKey,legacy);APP_SESSION_STORAGE.removeItem(STORAGE_API_KEY_LEGACY);APP_LOCAL_STORAGE.removeItem(STORAGE_API_KEY_LEGACY)}
  }
  return value
}
function saveApiKey(value,persist,{apiUrl=state.config.apiUrl}={}){
  const normalized=normalizeApiUrl(apiUrl),host=apiStorageHost(normalized),storageKey=apiKeyStorageKey(normalized),clean=String(value||"").trim();
  apiKeyMemory={host,value:clean};APP_SESSION_STORAGE.removeItem(STORAGE_API_KEY_LEGACY);APP_LOCAL_STORAGE.removeItem(STORAGE_API_KEY_LEGACY);
  if(!clean){APP_SESSION_STORAGE.removeItem(storageKey);APP_LOCAL_STORAGE.removeItem(storageKey);return}
  if(persist){APP_LOCAL_STORAGE.setItem(storageKey,clean);APP_SESSION_STORAGE.removeItem(storageKey)}else{APP_SESSION_STORAGE.setItem(storageKey,clean);APP_LOCAL_STORAGE.removeItem(storageKey)}
}
function redactSecrets(text){const secrets=new Set([apiKeyMemory.value,getApiKey()].filter(Boolean));let output=String(text);for(const secret of secrets)output=output.split(secret).join("[REDACTED]");return output}
'''
          ai = replace_between(ai, 'function getApiKey(){', 'function protocolError', key_block, 'API Key 函数块')

          normalize_shape = r'''
function normalizeAiProtocolShape(input,{stage=""}={}){
  if(!isPlainObject(input))return input;const obj=deepClone(input);obj.protocolVersion=normalizeAiProtocolVersion(obj.protocolVersion);obj.decision=normalizeEnum(obj.decision);
  if(obj.stateChanges===undefined)obj.stateChanges=[];if(obj.campaignChanges===undefined)obj.campaignChanges=[];if(obj.locationEffect===undefined)obj.locationEffect={type:"stay",targetNodeId:null};if(obj.nodeProposal===undefined)obj.nodeProposal=null;if(obj.endingProposal===undefined)obj.endingProposal=null;if(obj.actionSuggestions===undefined)obj.actionSuggestions=[];
  if(isPlainObject(obj.check)){for(const key of ["type","system","difficulty","visibility","trigger","origin"])if(obj.check[key]!==undefined)obj.check[key]=normalizeEnum(obj.check[key]);if(obj.check.skillId!==undefined)obj.check.skillId=String(obj.check.skillId).trim()}
  if(isPlainObject(obj.locationEffect)&&obj.locationEffect.type!==undefined)obj.locationEffect.type=normalizeEnum(obj.locationEffect.type);
  const amountOps=new Set(["adjustHp","adjustSan","adjustResource","adjustTension","adjustProgress","advanceClock"]);for(const list of [obj.stateChanges,obj.campaignChanges])if(Array.isArray(list))for(const item of list){if(!isPlainObject(item))continue;if(typeof item.operation==="string")item.operation=item.operation.trim();if(!amountOps.has(item.operation)||item.amount!==undefined)continue;for(const alias of ["by","delta"]){if(item[alias]!==undefined&&Number.isFinite(Number(item[alias]))){item.amount=Number(item[alias]);break}}}
  return obj
}
'''
          ai = replace_between(ai, 'function normalizeAiProtocolShape(', 'function serializeTrueState', normalize_shape, '协议形状规范化')
          ai = ai.replace('const schema={protocolVersion:"1.3",', 'const schema={protocolVersion:AI_PROTOCOL_VERSION,', 1)

          call_completion = r'''
async function readResponseTextLimited(response,limit=MAX_API_RESPONSE_BYTES){
  const declared=Number(response.headers?.get?.("content-length")||0);if(declared>limit)throw protocolError("API_RESPONSE_TOO_LARGE",`API 响应超过 ${limit} 字节上限`);
  const text=await response.text();if(utf8Bytes(text)>limit)throw protocolError("API_RESPONSE_TOO_LARGE",`API 响应超过 ${limit} 字节上限`);return text
}
function parseChatCompletionBody(text){let data;try{data=JSON.parse(text)}catch{throw new Error("API 返回体不是有效 JSON")};const content=data?.choices?.[0]?.message?.content;if(typeof content!=="string")throw new Error("返回格式不是兼容的 Chat Completions 结构");if(utf8Bytes(content)>MAX_API_RESPONSE_BYTES)throw protocolError("API_RESPONSE_TOO_LARGE","模型输出内容超过安全上限");return content}
async function callChatCompletion(messages,{timeoutMs=state.config.timeoutMs,jsonMode=true,temperature=null}={}){
  const apiUrl=normalizeApiUrl(state.config.apiUrl),model=state.config.model.trim(),key=getApiKey(apiUrl);if(!model)throw new Error("模型名称为空");if(!key)throw new Error("API Key 为空");
  const controller=new AbortController();activeAbortController=controller;const timeout=setTimeout(()=>controller.abort("timeout"),clamp(Number(timeoutMs)||60000,5000,180000));
  const structuredTemperature=temperature===null?(jsonMode?Math.min(clamp(Number(state.config.temperature)||0.7,0,2),0.5):clamp(Number(state.config.temperature)||0.7,0,2)):clamp(Number(temperature),0,2);
  const requestOnce=async includeJsonMode=>{const body={model,messages,temperature:structuredTemperature};if(includeJsonMode)body.response_format={type:"json_object"};const response=await fetch(apiUrl,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},body:JSON.stringify(body),signal:controller.signal});return{response,text:await readResponseTextLimited(response)}};
  try{
    let attempt=await requestOnce(Boolean(jsonMode));
    if(!attempt.response.ok){let body=redactSecrets(attempt.text),unsupported=Boolean(jsonMode)&&[400,404,415,422].includes(attempt.response.status)&&/response[_ -]?format|json[_ -]?object|json mode|unsupported/i.test(body);if(unsupported){addLog("api","当前兼容接口不支持 response_format，已安全回退为普通 JSON 提示请求");attempt=await requestOnce(false);body=redactSecrets(attempt.text)}if(!attempt.response.ok){const map={401:"API Key 无效或未授权",403:"API 无权限",404:"API 地址或模型路径错误",429:"请求频率过高或额度不足"};throw new Error(`${map[attempt.response.status]||`API 返回 ${attempt.response.status}`}：${body.slice(0,500)}`)}}
    return parseChatCompletionBody(attempt.text)
  }catch(error){if(error.name==="AbortError")throw new Error("请求已取消或超时");if(error instanceof TypeError)throw new Error("网络请求失败，可能是 CORS、网络不可达或本地 file:// 来源被服务端拒绝");throw error}
  finally{clearTimeout(timeout);if(activeAbortController===controller)activeAbortController=null}
}
'''
          ai = replace_between(ai, 'async function callChatCompletion(', 'function normalizeCheck', call_completion, 'Chat Completions 调用')

          repair_block = r'''
function repairJsonSyntaxLocally(raw){
  let text=extractFirstJsonObject(raw).replace(/^\uFEFF/,"").trim();if(!text)return text;
  text=text.replace(/,\s*([}\]])/g,"$1");
  let depthCurly=0,depthSquare=0,inString=false,escape=false;for(const char of text){if(inString){if(escape)escape=false;else if(char==="\\")escape=true;else if(char==='"')inString=false;continue}if(char==='"'){inString=true;continue}if(char==="{")depthCurly++;else if(char==="}")depthCurly--;else if(char==="[")depthSquare++;else if(char==="]")depthSquare--}
  if(inString||depthCurly<0||depthSquare<0)return text;return text+"]".repeat(depthSquare)+"}".repeat(depthCurly)
}
async function parseAndRepairAiResponse(raw,meta){
  if(utf8Bytes(raw)>MAX_API_RESPONSE_BYTES)throw withRawResponse(protocolError("API_RESPONSE_TOO_LARGE","AI 响应超过安全上限"),"",meta.stage);
  const extracted=extractFirstJsonObject(raw),first=safeJsonParse(extracted);if(first.ok){try{return validateAiResponse(first.value,meta)}catch(error){throw withRawResponse(error,raw,meta.stage)}}
  const repairedText=repairJsonSyntaxLocally(raw),repaired=safeJsonParse(repairedText);if(!repaired.ok)throw withRawResponse(protocolError("AI_RESPONSE_JSON_PARSE_FAILED","AI 响应 JSON 解析失败，本地安全修复后仍无法解析"),raw,meta.stage);
  try{return validateAiResponse(repaired.value,meta)}catch(error){throw withRawResponse(error,raw,meta.stage)}
}
'''
          ai = replace_between(ai, 'async function parseAndRepairAiResponse(', '/* =========================\n   状态变化事务', repair_block, 'JSON 修复流程')
          write(ai_path, ai)

          # 4) 存档：剥离 API 传输配置、导入深度/节点限制、清空临时运行态
          saves_path = ROOT / 'src/saves.js'
          saves = read(saves_path)
          save_helpers = r'''
function sanitizeImportedRuntime(runtime){const clean=isPlainObject(runtime)?deepClone(runtime):{};for(const key of ["activeRequestId","requestStartedAt","pendingCheck","checkQueue","pendingSecretResults","pendingNodeProposal","pendingEndingProposal","pendingActionSuggestions","lastContinuationPayload","failedRequest","lastRawAiResponse","turnSnapshot","lastContextEnvelope","lastLoreSelection","improvDraft","pendingDirectorEvent","currentResolutionRecordId"]){if(["checkQueue","pendingSecretResults","pendingActionSuggestions","lastLoreSelection"].includes(key))clean[key]=[];else clean[key]=null}clean.pendingPlayerAction="";clean.checkChainDepth=0;clean.summaryInProgress=false;clean.improvGenerating=false;clean.hintGenerating=false;clean.phase="awaiting_player_action";return clean}
function inspectImportedJsonShape(value){let nodes=0,maxDepth=0,maxString=0;const stack=[{value,depth:0}];while(stack.length){const current=stack.pop(),item=current.value;nodes++;maxDepth=Math.max(maxDepth,current.depth);if(nodes>MAX_IMPORT_NODES)throw new Error(`导入对象节点数量超过 ${MAX_IMPORT_NODES}`);if(current.depth>MAX_IMPORT_DEPTH)throw new Error(`导入对象嵌套深度超过 ${MAX_IMPORT_DEPTH}`);if(typeof item==="string"){maxString=Math.max(maxString,item.length);if(item.length>MAX_IMPORT_STRING_LENGTH)throw new Error(`导入内容包含超过 ${MAX_IMPORT_STRING_LENGTH} 字符的字符串`);continue}if(!item||typeof item!=="object")continue;if(hasDangerousKeys(item))throw new Error("导入内容包含危险键名");for(const child of Object.values(item))stack.push({value:child,depth:current.depth+1})}return{nodes,maxDepth,maxString}}
function countImportedScenario(scenario){let nodes=0,clues=0;for(const chapter of scenario?.chapters||[])for(const scene of chapter?.scenes||[])for(const node of scene?.nodes||[]){nodes++;clues+=Array.isArray(node.clues)?node.clues.length:0}return{nodes,clues}}
'''
          saves = replace_once(saves, 'function serializeSave(){', save_helpers.strip()+'\nfunction serializeSave(){', '存档安全辅助函数')
          saves = replace_once(
              saves,
              'const snapshot=deepClone(state);snapshot.appVersion=APP_VERSION;snapshot.schemaVersion=SCHEMA_VERSION;delete snapshot.config.apiKey;',
              'const snapshot=deepClone(state);snapshot.appVersion=APP_VERSION;snapshot.schemaVersion=SCHEMA_VERSION;snapshot.config=stripApiTransportConfig(snapshot.config);',
              '导出存档剥离 API 配置'
          )
          saves = replace_once(
              saves,
              'config:{...base.config,...(isPlainObject(source.config)?source.config:{})}',
              'config:applyStoredApiPreferences({...base.config,...stripApiTransportConfig(isPlainObject(source.config)?source.config:{})})',
              '载入存档隔离 API 配置'
          )
          validate_save = r'''
function validateImportedSave(save){
  const errors=[];if(!isPlainObject(save))return["存档顶层不是对象"];
  try{inspectImportedJsonShape(save)}catch(error){errors.push(error.message)}
  if(hasDangerousKeys(save))errors.push("存档包含危险键名");const version=Number(save.schemaVersion);if(!Number.isInteger(version)||version<1||version>SCHEMA_VERSION)errors.push(`不兼容的 schemaVersion：${save.schemaVersion}`);if(!isPlainObject(save.state))errors.push("缺少 state");if(!save.slotName)errors.push("缺少槽位名称");if(Array.isArray(save.state?.messages)&&save.state.messages.length>5000)errors.push("消息数量超出导入限制");if(Array.isArray(save.state?.logs)&&save.state.logs.length>10000)errors.push("日志数量超出导入限制");const counts=countImportedScenario(save.state?.scenario);if(counts.nodes>MAX_IMPORTED_SCENARIO_NODES)errors.push(`剧本节点超过 ${MAX_IMPORTED_SCENARIO_NODES}`);if(counts.clues>MAX_IMPORTED_SCENARIO_CLUES)errors.push(`剧本线索超过 ${MAX_IMPORTED_SCENARIO_CLUES}`);return Array.from(new Set(errors))
}
'''
          saves = replace_between(saves, 'function validateImportedSave(', 'function exportCurrentSave', validate_save, '存档导入校验')
          import_save = r'''
function importSaveObject(save){
  const errors=validateImportedSave(save);if(errors.length)throw new Error(errors.join("；"));const imported=deepClone(save);imported.schemaVersion=SCHEMA_VERSION;imported.appVersion=APP_VERSION;const sourceState=deepClone(imported.state);sourceState.config=stripApiTransportConfig(sourceState.config);sourceState.runtime=sanitizeImportedRuntime(sourceState.runtime);imported.state=normalizeLoadedState(sourceState);imported.slotId=uid("slot");imported.slotName=`${asString(imported.slotName,80)||"导入存档"}（导入）`;imported.state.saveMeta={slotId:imported.slotId,slotName:imported.slotName,createdAt:nowIso(),updatedAt:nowIso()};APP_LOCAL_STORAGE.setItem(STORAGE_SLOT_PREFIX+imported.slotId,JSON.stringify(imported));const index=getSaveIndex();index.unshift({slotId:imported.slotId,slotName:imported.slotName,updatedAt:nowIso()});setSaveIndex(index.slice(0,30));loadSlot(imported.slotId)
}
'''
          saves = replace_between(saves, 'function importSaveObject(', 'async function organizeScenarioWithAi', import_save, '存档导入净化')
          write(saves_path, saves)

          # 5) 场景引擎：真实协议自检
          scenario_path = ROOT / 'src/scenario-engine.js'
          scenario = read(scenario_path)
          selfcheck = r'''
function protocolSelfCheckFixtures(requestId="selfcheck",baseRevision=0){return{
  noCheck:{protocolVersion:AI_PROTOCOL_VERSION,requestId,baseRevision,decision:"no_check",narrative:"你环顾房间，没有立即发现必须检定的障碍。",check:null,stateChanges:[],campaignChanges:[],locationEffect:{type:"stay"},nodeProposal:null,endingProposal:null,actionSuggestions:[]},
  check:{protocolVersion:AI_PROTOCOL_VERSION,requestId,baseRevision,decision:"check",narrative:"你开始仔细检查现场。",check:{type:"skill",system:"coc7",skillId:"spot_hidden",label:"侦查",mandatory:false,visibility:"public",reason:"搜索异常痕迹"},stateChanges:[],campaignChanges:[],locationEffect:{type:"stay"},nodeProposal:null,endingProposal:null,actionSuggestions:[]}
}}
function validateProtocolSelfCheckLocally(){const originalCharacter=state.character;try{state.character={system:"coc7",san:60,luck:50,attributes:{str:50,con:50,siz:50,dex:50,app:50,int:50,pow:60,edu:50},skills:[{id:"spot_hidden",name:"侦查",value:55}]};const requestId="local_selfcheck",baseRevision=3,fixtures=protocolSelfCheckFixtures(requestId,baseRevision),noCheck=validateAiResponse(fixtures.noCheck,{requestId,baseRevision,stage:"action_adjudication"}),check=validateAiResponse(fixtures.check,{requestId,baseRevision,stage:"action_adjudication"}),alias=validateAiResponse({...fixtures.noCheck,campaignChanges:[{operation:"advanceClock",clockId:"clock-primary",by:1}]},{requestId,baseRevision,stage:"action_adjudication"});let rejectedUnknown=false;try{validateAiResponse({...fixtures.noCheck,stateChanges:[{operation:"unknownOperation"}]},{requestId,baseRevision,stage:"action_adjudication"})}catch{rejectedUnknown=true}return noCheck.decision==="no_check"&&check.check?.required===true&&alias.campaignChanges[0]?.amount===1&&rejectedUnknown}finally{state.character=originalCharacter}}
async function runApiProtocolSelfCheck(){
  if(activeAbortController||state.runtime.activeRequestId)throw new Error("当前已有请求正在进行");const results=[],started=nowIso();
  try{
    results.push({name:"本地正式校验器",ok:validateProtocolSelfCheckLocally(),detail:"执行 no_check、check.required 派生、by→amount 与未知 operation 拒绝"});
    const plain=await callChatCompletion([{role:"system",content:"只回复 OK"},{role:"user",content:"连接测试"}],{timeoutMs:Math.min(state.config.timeoutMs,20000),jsonMode:false,temperature:0.1});results.push({name:"网络、鉴权与模型",ok:/OK/i.test(plain),detail:/OK/i.test(plain)?"通过":"接口可用，但未按要求回复 OK"});
