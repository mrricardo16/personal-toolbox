name: TRPG v1.6.8 Combat Release Gate

on:
  push:
    branches: [agent/v1.6.8-combat-opposed]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.8-combat-opposed
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply formal v1.6.8 release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count!=1: raise SystemExit(f'{path}: expected 1 match, found {count}: {old!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('trpg-dm-assistant/src/scenarios/library.js','const APP_VERSION = "1.6.7";','const APP_VERSION = "1.6.8";')

          old='assert.equal(api.APP_VERSION,"1.6.7");'
          forward='{const [major,minor,patch]=api.APP_VERSION.split(".").map(Number);assert(major>1||(major===1&&(minor>6||(minor===6&&patch>=7))),`unexpected forward version ${api.APP_VERSION}`)};'
          changed=[]
          for p in sorted(Path('trpg-dm-assistant/build').glob('test-v*.js')):
              if p.name=='test-v168-combat-opposed.js': continue
              text=p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old,forward),encoding='utf-8'); changed.append(p.name)
          print('Forward-compatible historical 1.6.7 assertions:', ', '.join(changed) if changed else 'already compatible')

          p=Path('trpg-dm-assistant/build/test-v168-combat-opposed.js'); text=p.read_text(encoding='utf-8')
          anchor='await test("v1.6.8 Combat Opposed 模块加载",async()=>{assert.equal(api.COMBAT_OPPOSED_VERSION,"1.0");'
          replacement='await test("v1.6.8 Combat Opposed 模块加载",async()=>{assert.equal(api.APP_VERSION,"1.6.8");assert.equal(api.COMBAT_OPPOSED_VERSION,"1.0");'
          if replacement not in text:
              if text.count(anchor)!=1: raise SystemExit('v168 APP_VERSION assertion insertion point missing')
              p.write_text(text.replace(anchor,replacement,1),encoding='utf-8')

          p=Path('trpg-dm-assistant/build/test-real-api-v1513.js'); text=p.read_text(encoding='utf-8')
          old_modules='"hp-damage-state.js","health-stabilization.js","healing-recovery.js"]'
          new_modules='"hp-damage-state.js","health-stabilization.js","healing-recovery.js","combat-opposed.js"]'
          if new_modules not in text:
              if text.count(old_modules)!=1: raise SystemExit('real API combat module insertion point missing')
              text=text.replace(old_modules,new_modules,1)
          old_export='HP_DAMAGE_STATE_VERSION,HEALTH_STABILIZATION_VERSION,HEALING_RECOVERY_VERSION,ready:'
          new_export='HP_DAMAGE_STATE_VERSION,HEALTH_STABILIZATION_VERSION,HEALING_RECOVERY_VERSION,COMBAT_OPPOSED_VERSION,ready:'
          if new_export not in text:
              if text.count(old_export)!=1: raise SystemExit('real API combat export insertion point missing')
              text=text.replace(old_export,new_export,1)
          if 'assert.equal(api.APP_VERSION,"1.6.8");' not in text:
              if text.count('assert.equal(api.APP_VERSION,"1.6.7");')!=1: raise SystemExit('real API APP_VERSION assertion missing')
              text=text.replace('assert.equal(api.APP_VERSION,"1.6.7");','assert.equal(api.APP_VERSION,"1.6.8");',1)
          if 'assert.equal(api.COMBAT_OPPOSED_VERSION,"1.0");' not in text:
              anchor='assert.equal(api.HEALING_RECOVERY_VERSION,"1.0");'
              if anchor not in text: raise SystemExit('real API healing assertion missing')
              text=text.replace(anchor,anchor+'assert.equal(api.COMBAT_OPPOSED_VERSION,"1.0");',1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: v1.6.8 focused deterministic
        run: node trpg-dm-assistant/build/test-v168-combat-opposed.js

      - name: Full permanent deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          grep -oE 'node trpg-dm-assistant/build/test-[^[:space:]]+\.js' .github/workflows/trpg-ci.yml | while IFS= read -r cmd; do
            echo "> $cmd"
            eval "$cmd"
          done

      - name: JavaScript syntax and deterministic product
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          git diff --check

      - name: Real DeepSeek current-runtime full-case E2E
        env:
          TRPG_TEST_API_KEY: ${{ secrets.DS_KEY }}
          TRPG_TEST_API_URL: https://api.deepseek.com/v1/chat/completions
          TRPG_TEST_MODEL: deepseek-v4-flash
        run: |
          set -euo pipefail
          test -n "$TRPG_TEST_API_KEY"
          node trpg-dm-assistant/build/test-real-api-v1513.js

      - name: Persist formal release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trpg-dm-assistant/src/scenarios/library.js trpg-dm-assistant/build/test-v*.js trpg-dm-assistant/build/test-real-api-v1513.js trpg-dm-assistant/outputs/trpg-dm-assistant.html
          if git diff --cached --quiet; then
            echo 'Release files already current.'
            exit 0
          fi
          git commit -m 'Finalize TRPG v1.6.8 release identity'
          git push origin HEAD:agent/v1.6.8-combat-opposed
