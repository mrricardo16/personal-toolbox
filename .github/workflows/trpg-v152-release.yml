# release retry after semantic v1.5.1 regression fix
name: One-shot TRPG DM Assistant v1.5.2 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trpg-v152-release.yml'

permissions:
  contents: write

jobs:
  patch-test-real-api-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply v1.5.2 patches
        run: |
          python3 .github/scripts/trpg-v152-core.py
          python3 .github/scripts/trpg-v152-similarity-fix.py
          python3 .github/scripts/trpg-v152-polish.py

      - name: Runtime security and protocol tests
        run: node trpg-dm-assistant/build/test-security-hardening.js

      - name: Save management interaction regression
        run: node trpg-dm-assistant/build/test-save-ui.js

      - name: CoC outcome regression
        run: node trpg-dm-assistant/build/test-coc-outcomes.js

      - name: Situation sidebar regression
        run: node trpg-dm-assistant/build/test-situation-ui.js

      - name: AI JSON repair corpus
        run: node trpg-dm-assistant/build/test-ai-json-repair.js

      - name: v1.5.0 experience regression
        run: node trpg-dm-assistant/build/test-v150-experience.js

      - name: v1.5.1 investigation stability regression
        run: node trpg-dm-assistant/build/test-v151-investigation-stability.js

      - name: v1.5.2 long-session regression
        run: node trpg-dm-assistant/build/test-v152-long-session.js

      - name: JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)

      - name: Build and verify single HTML
        shell: bash
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          test "$(find trpg-dm-assistant -type f -name '*.html' | wc -l)" -eq 1
          git diff --check

      - name: Real API 20-round acceptance
        env:
          TRPG_TEST_API_KEY: ${{ secrets.DS_KEY }}
          TRPG_TEST_API_URL: https://api.deepseek.com/chat/completions
          TRPG_TEST_MODEL: deepseek-v4-flash
          TRPG_TEST_ROUNDS: '20'
        run: |
          test -n "$TRPG_TEST_API_KEY"
          node trpg-dm-assistant/build/test-real-api-v152.js

      - name: Commit v1.5.2 to main
        shell: bash
        run: |
          rm .github/scripts/trpg-v152-core.py
          rm .github/scripts/trpg-v152-similarity-fix.py
          rm .github/scripts/trpg-v152-polish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md trpg-dm-assistant .github/scripts/trpg-v152-core.py .github/scripts/trpg-v152-similarity-fix.py .github/scripts/trpg-v152-polish.py
          git diff --cached --check
          git commit -m 'Release TRPG DM Assistant v1.5.2'
          git push origin HEAD:main
