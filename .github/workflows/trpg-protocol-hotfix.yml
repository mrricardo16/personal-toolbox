name: TRPG protocol stability hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trpg-protocol-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply protocol stability patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"无法定位 {label}")
              return text.replace(old, new, 1)

          path = Path('trpg-dm-assistant/src/ai-protocol.js')
          text = path.read_text(encoding='utf-8')
          helpers = '''const AI_PROTOCOL_VERSION="1.3";
          function normalizeAiProtocolVersion(value){const text=String(value??"").trim(),match=text.match(/^(\\d+)\\.(\\d+)(?:\\.\\d+)?$/);return match?`${Number(match[1])}.${Number(match[2])}`:text}
          function normalizeAiProtocolShape(input,{stage=""}={}){if(!isPlainObject(input))return input;const obj=deepClone(input);obj.protocolVersion=normalizeAiProtocolVersion(obj.protocolVersion);if(obj.stateChanges===undefined)obj.stateChanges=[];if(obj.campaignChanges===undefined)obj.campaignChanges=[];if(obj.locationEffect===undefined)obj.locationEffect={type:"stay",targetNodeId:null};if(obj.nodeProposal===undefined)obj.nodeProposal=null;if(obj.endingProposal===undefined)obj.endingProposal=null;if(obj.actionSuggestions===undefined)obj.actionSuggestions=[];const amountOps=new Set(["adjustHp","adjustSan","adjustResource","adjustTension","adjustProgress","advanceClock"]);for(const list of [obj.stateChanges,obj.campaignChanges])if(Array.isArray(list))for(const item of list){if(!isPlainObject(item)||!amountOps.has(item.operation)||item.amount!==undefined)continue;for(const alias of ["by","delta"]){if(item[alias]!==undefined&&Number.isFinite(Number(item[alias]))){item.amount=Number(item[alias]);break}}}return obj}
          '''
          text = replace_once(text, 'function serializeTrueState(){', helpers + 'function serializeTrueState(){', '协议归一化函数')
          text = replace_once(text, 'payload={protocolVersion:"1.2",', 'payload={protocolVersion:AI_PROTOCOL_VERSION,', '请求协议版本')
          text = replace_once(text, 'function validateAiResponse(obj,{requestId,baseRevision,stage}){\n  if(!isPlainObject(obj))', 'function validateAiResponse(obj,{requestId,baseRevision,stage}){\n  obj=normalizeAiProtocolShape(obj,{stage});\n  if(!isPlainObject(obj))', '响应归一化入口')
          old = 'const stateChanges=validateOperationArray(obj.stateChanges,{fieldName:"stateChanges",label:"状态变化",allowed:ALLOWED_STATE_OPERATIONS,max:40}),campaignChanges=obj.campaignChanges===undefined?[]:validateOperationArray(obj.campaignChanges,{fieldName:"campaignChanges",label:"剧情变化",allowed:ALLOWED_CAMPAIGN_OPERATIONS,max:30}),check=normalizeCheck(obj.check);let decision=asString(obj.decision,40);'
          new = 'const stateChanges=validateOperationArray(obj.stateChanges,{fieldName:"stateChanges",label:"状态变化",allowed:ALLOWED_STATE_OPERATIONS,max:40}),campaignChanges=validateOperationArray(obj.campaignChanges,{fieldName:"campaignChanges",label:"剧情变化",allowed:ALLOWED_CAMPAIGN_OPERATIONS,max:30});let decision=asString(obj.decision,40),rawCheck=isPlainObject(obj.check)?deepClone(obj.check):obj.check;if((decision==="check"||(stage!=="action_adjudication"&&!decision))&&isPlainObject(rawCheck))rawCheck.required=true;const check=normalizeCheck(rawCheck);'
          text = replace_once(text, old, new, '检定 required 派生')
          old = 'const reqNumber=(raw,key,index,label)=>{const value=Number(raw[key]);if(!Number.isFinite(value))throw protocolError("STATE_CHANGE_PARAMETER_INVALID",`第 ${index+1} 项${label}操作参数缺失或不是有效数字：${key}`,{index:index+1,key});return value};'
          new = 'const reqNumber=(raw,key,index,label)=>{const candidates=key==="amount"?[key,"by","delta"]:[key];for(const candidate of candidates){if(raw[candidate]===undefined||raw[candidate]===null||raw[candidate]==="")continue;const value=Number(raw[candidate]);if(Number.isFinite(value))return value}throw protocolError("STATE_CHANGE_PARAMETER_INVALID",`第 ${index+1} 项${label}操作参数缺失或不是有效数字：${key}`,{index:index+1,key});};'
          text = replace_once(text, old, new, 'amount 参数兼容')
          old = '剧情操作：${Array.from(ALLOWED_CAMPAIGN_OPERATIONS).join(", ")}\naction_adjudication 若 decision=check'
          new = '剧情操作：${Array.from(ALLOWED_CAMPAIGN_OPERATIONS).join(", ")}\n检定规则：decision=check 时必须返回 check 对象；required 由页面根据 decision 推导，不需要返回。mandatory 只表示能否跳过。\n数值变化统一使用 amount；advanceClock 必须包含 clockId。\naction_adjudication 若 decision=check'
          text = replace_once(text, old, new, '提示词参数说明')
          path.write_text(text, encoding='utf-8')

          lib = Path('trpg-dm-assistant/src/scenarios/library.js')
          lib.write_text(replace_once(lib.read_text(encoding='utf-8'), 'const APP_VERSION = "1.4.2";', 'const APP_VERSION = "1.4.3";', '版本号'), encoding='utf-8')

          ui = Path('trpg-dm-assistant/src/ui.js')
          ui_text = ui.read_text(encoding='utf-8')
          ui_text = replace_once(ui_text, 'validateOperationArray,validateAiResponse,prepareStateChanges', 'validateOperationArray,validateAiResponse,normalizeAiProtocolShape,normalizeAiProtocolVersion,prepareStateChanges', '测试接口导出')
          ui.write_text(ui_text, encoding='utf-8')

          readme = Path('trpg-dm-assistant/README.md')
          r = readme.read_text(encoding='utf-8')
          r = replace_once(r, '# TRPG AI 主持助手 v1.4.2', '# TRPG AI 主持助手 v1.4.3', 'README 标题')
          r = replace_once(r, '当前版本为 v1.4.2。', '当前版本为 v1.4.3。', 'README 版本')
          notes = '## v1.4.3 更新内容\n\n- 修复 `decision=check` 因缺少冗余 `required` 字段而整轮失败。\n- 兼容协议版本数字 `1.3` 与字符串 `1.3.0`。\n- 安全归一化 `amount` 的 `by` / `delta` 别名。\n- 补充检定和状态操作参数提示，未知 operation 仍严格拒绝。\n\n## v1.4.2 更新内容'
          r = replace_once(r, '## v1.4.2 更新内容', notes, 'README 更新说明')
          r = r.replace('- v1.4.2：修复 Schema 8 存档导入', '- v1.4.3：修复裁决协议稳定性与自由行动阻断。\n- v1.4.2：修复 Schema 8 存档导入', 1)
          r = r.replace('- src/：v1.4.2 的模块化源码', '- src/：v1.4.3 的模块化源码')
          readme.write_text(r, encoding='utf-8')

          test = Path('trpg-dm-assistant/build/test-protocol-stability.js')
          test.write_text('''"use strict";\nconst fs=require("fs"),assert=require("assert");\nconst s=fs.readFileSync(require("path").join(__dirname,"../src/ai-protocol.js"),"utf8");\nassert.match(s,/obj=normalizeAiProtocolShape\\(obj,\\{stage\\}\\)/);\nassert.match(s,/rawCheck\\.required=true/);\nassert.match(s,/\\[key,"by","delta"\\]/);\nconst norm=v=>{const t=String(v??"").trim(),m=t.match(\\/^(\\\\d+)\\\\.(\\\\d+)(?:\\\\.\\\\d+)?$\\/);return m?`${Number(m[1])}.${Number(m[2])}`:t};\nassert.equal(norm(1.3),"1.3");assert.equal(norm("1.3.0"),"1.3");\nconst change={operation:"advanceClock",by:1};if(change.amount===undefined&&Number.isFinite(Number(change.by)))change.amount=Number(change.by);assert.equal(change.amount,1);\nconsole.log("Protocol stability tests passed");\n''', encoding='utf-8')

          report = '\n'.join(['# TRPG DM Assistant v1.4.3 测试报告','','修复裁决 required 冗余、协议版本格式漂移和 amount 参数别名。','','验证：协议回归测试、全部 JS 语法检查、单文件构建校验、连续构建一致性和 git diff --check。',''])
          Path('trpg-dm-assistant/v1.4.3-test-report.md').write_text(report, encoding='utf-8')
          PY

      - name: Run protocol regression tests
        run: node trpg-dm-assistant/build/test-protocol-stability.js

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)

      - name: Build and verify single HTML
        shell: bash
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          test "$(find trpg-dm-assistant -type f -name '*.html' | wc -l)" -eq 1
          git diff --check

      - name: Commit hotfix to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trpg-dm-assistant/src trpg-dm-assistant/build trpg-dm-assistant/outputs/trpg-dm-assistant.html trpg-dm-assistant/README.md trpg-dm-assistant/v1.4.3-test-report.md
          git commit -m 'Fix TRPG AI protocol stability v1.4.3'
          git push origin HEAD:main
