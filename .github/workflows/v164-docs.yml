name: Finalize TRPG v1.6.4 Documentation

on:
  push:
    branches:
      - agent/v1.6.4-indefinite-insanity-tracking

permissions:
  contents: write

jobs:
  docs:
    if: github.event.head_commit.message == 'Run v1.6.4 documentation finalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('trpg-dm-assistant/README.md')
          s=p.read_text()
          s=s.replace('# TRPG AI 主持助手 v1.6.3','# TRPG AI 主持助手 v1.6.4',1)
          s=s.replace('当前版本为 v1.6.3。','当前版本为 v1.6.4。',1)
          marker='## v1.6.3 更新内容\n'
          section='''## v1.6.4 更新内容\n\n- 新增 SAN Loss Window / Indefinite Insanity Tracking 1.0：浏览器现在拥有 Starting SAN 基线窗口、窗口内累计 SAN 损失与不定期疯狂 1/5 阈值；AI 只可叙述 browser-owned 结果。\n- 启用结构化剧本时，以当前 SAN 建立 authoritative scenario window；跨 authored chapter 时用当时 current SAN 建立新窗口，同 chapter 内节点移动不会重置累计值。\n- 阈值固定为窗口起始 SAN 的五分之一（向下取整，极低 SAN 至少需要实际损失 1 点），后续 current SAN 变化不会反向移动阈值。\n- v1.6.3 SAN check 的实际损失与 trusted canonical transaction 的 SAN 下降都会进入同一累计窗口；相同 source event 自动去重，SAN 恢复不会被误记为损失。\n- 累计损失首次达到或超过阈值时，浏览器写入 canonical indefinite condition，并记录来源窗口、阈值、触发时累计损失与触发事件；后续损失继续累计但不会重复触发。\n- 新窗口只重置新的累计基线，不恢复 SAN，也不会擅自清除已经存在的不定期疯狂状态；本版明确不伪造恢复/过期时长。\n- 旧 Schema 8 状态如果没有 authoritative window，不会根据“当前 SAN 比旧基线低多少”反推一个虚假的连续窗口；sanityStateSnapshot 继续保持纯读取。\n- 系统提示与 SAN context 明确 Starting SAN window、累计值和 indefinite condition 均为浏览器权威；AI 不得重置窗口、篡改累计损失、提前宣告或解除不定期疯狂，且防御不能阻断正常玩家交互。\n- 新增 31 条 v1.6.4 deterministic 回归；连同既有 613 条，正式 release gate 为 **644 PASS / 0 FAIL**，并通过 JavaScript syntax、deterministic double build 与 single-HTML verifier。\n- 真实 DeepSeek final Run `31553994885`：8 actions / 8 structured requests / 7 usable provider responses / 14 API attempts / 6 retries / 7 provider empty / 1 retry exhaustion / 1 graceful fallback / 0 technical leaks；最终正常 `campaign_ended`，结局为 `ending-solved`。该样本未触发 SAN 累计阈值，因此 SAN window 机械正确性以 31 条 deterministic 专项为证。\n- APP_VERSION 为 v1.6.4，Save Schema 仍为 8，AI protocol 仍为 1.3，不增加正常 AI 请求；正式单 HTML 为 **556994 bytes**。\n- 临时疯狂过期/恢复、不定期疯狂恢复，以及 HP/重伤/昏迷/濒死规则仍留在后续 v1.6.x，不把未实现内容包装成已完成。\n\n'''
          if marker not in s: raise SystemExit('v1.6.3 marker missing')
          if '## v1.6.4 更新内容' not in s: s=s.replace(marker,section+marker,1)
          p.write_text(s)
          PY
      - name: Validate README release identity
        run: |
          grep -q '^# TRPG AI 主持助手 v1.6.4$' trpg-dm-assistant/README.md
          grep -q '644 PASS / 0 FAIL' trpg-dm-assistant/README.md
          grep -q '31553994885' trpg-dm-assistant/README.md
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/README.md
          git commit -m "Document TRPG DM Assistant v1.6.4"
          git push origin HEAD:agent/v1.6.4-indefinite-insanity-tracking
