<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TRPG AI 主持助手</title>
<style>
:root{
  --bg:#0b0f13;--panel:#121820;--panel2:#18212b;--line:#2a3745;--text:#d8e0e8;
  --muted:#8493a3;--accent:#c5a46d;--accent2:#8eb6a0;--danger:#d56d6d;--warn:#d5ad62;
  --ok:#78b98d;--shadow:0 18px 50px rgba(0,0,0,.35);--radius:12px;
}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at top,#15202a 0,#0b0f13 38%,#080b0e 100%);color:var(--text);font-family:"Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.danger{color:var(--danger)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr);height:100%}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(10,14,18,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:10}
.brand{font-weight:800;letter-spacing:.08em;color:var(--accent)}.status-pill{padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#10161c;color:var(--muted);font-size:12px;white-space:nowrap}.top-actions{margin-left:auto;display:flex;gap:8px}.top-actions button,.icon-btn{border:1px solid var(--line);background:#121a22;color:var(--text);padding:7px 10px;border-radius:8px}.top-actions button:hover,.icon-btn:hover{border-color:var(--accent)}
.sidebar{grid-column:1;grid-row:2;padding:14px;overflow:auto;border-right:1px solid var(--line);background:rgba(13,18,23,.95)}
.main{grid-column:2;grid-row:2;min-width:0;display:flex;flex-direction:column;overflow:hidden}.sidebar.collapsed{display:none}.app.sidebar-collapsed{grid-template-columns:0 minmax(0,1fr)}
.section{background:linear-gradient(180deg,rgba(24,33,43,.97),rgba(16,22,29,.97));border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.section h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}.kv{display:grid;grid-template-columns:98px 1fr;gap:7px 10px;font-size:13px}.kv b{color:#eef3f7;font-weight:600}.chip-list{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #3a4a5b;background:#111820;color:#bfcbd7;padding:4px 7px;border-radius:999px;font-size:12px}.meter{margin:7px 0}.meter-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.bar{height:8px;background:#0b1015;border:1px solid #263340;border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#7b9d89,#c5a46d);width:0}
.workspace{height:100%;display:flex;flex-direction:column;min-width:0}.view{display:none;height:100%;overflow:auto;padding:18px}.view.active{display:block}.chat-view.active{display:flex;flex-direction:column;padding:0;overflow:hidden}
.hero{max-width:1100px;margin:0 auto}.hero h1{margin:4px 0 8px;color:#e9dfcd;font-size:30px}.hero p{color:var(--muted);line-height:1.75}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:rgba(18,24,32,.95);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px;color:#eadfc8}.field{margin-bottom:12px}.field label{display:block;margin-bottom:6px;color:#b9c5d1;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #314050;border-radius:8px;background:#0c1218;color:var(--text);padding:10px;outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.grow{flex:1}.btn{border:1px solid #3a4b5c;border-radius:8px;background:#18222c;color:#e7edf2;padding:9px 13px}.btn:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:#8c744d;border-color:#b99a66;color:#fff}.btn.danger{background:#3a2022;border-color:#743b40;color:#ffd9d9}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.notice{padding:10px 12px;border-radius:8px;border:1px solid #3a4652;background:#10171e;color:#b8c4cf;font-size:13px;line-height:1.65}.notice.warn{border-color:#765b30;background:#241c10;color:#e4c78c}.notice.danger{border-color:#6b3338;background:#241315;color:#efb3b8}.notice.ok{border-color:#315e40;background:#102017;color:#b9e2c4}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#111820;color:var(--muted);padding:8px 11px;border-radius:8px}.tab.active{border-color:var(--accent);color:#fff;background:#2a241b}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:rgba(15,20,26,.96)}.chat-log{flex:1;overflow:auto;padding:18px}.message{max-width:880px;margin:0 auto 14px;border:1px solid var(--line);border-radius:12px;background:#111820;padding:12px 14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}.message.player{border-color:#4e5263;background:#171927}.message.ai{border-color:#5c513f;background:#1b1915}.message.system{border-style:dashed;color:#aab7c4}.message.error{border-color:#6c3539;background:#251417;color:#ffc3c7}.msg-meta{display:flex;gap:8px;margin-bottom:7px;color:var(--muted);font-size:12px}.msg-role{font-weight:700;color:var(--accent)}.chat-compose{border-top:1px solid var(--line);padding:12px;background:rgba(13,18,23,.98)}.chat-compose textarea{width:100%;min-height:82px;max-height:220px;resize:vertical;border:1px solid #334354;background:#0b1117;color:#edf2f6;border-radius:10px;padding:12px;outline:none}.chat-compose textarea:focus{border-color:var(--accent)}.compose-actions{display:flex;gap:8px;margin-top:8px;align-items:center}.compose-actions .phase{margin-right:auto;color:var(--muted);font-size:12px}
.check-card,.proposal-card,.change-card{max-width:880px;margin:0 auto 14px;border:1px solid #725b35;background:#201b13;border-radius:12px;padding:14px}.check-card h3,.proposal-card h3,.change-card h3{margin:0 0 8px;color:#ebd3a4}.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:13px}.dice-result{font-size:22px;font-weight:800;color:#f1d8a7;margin:8px 0}.audit{font-size:12px;color:var(--muted)}
.modal-layer{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.modal{width:min(920px,100%);max-height:90vh;overflow:auto;background:#111820;border:1px solid #3a4b5a;border-radius:14px;padding:18px;box-shadow:var(--shadow)}.modal h2{margin-top:0;color:#eadfc8}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.preview{height:320px;width:100%;background:#0a1015;color:#dbe3ea;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;white-space:pre-wrap;overflow:auto}.case-file{line-height:1.75}.case-file h2{margin:6px 0 0;color:var(--accent);font-size:28px}.case-file h3{margin:18px 0 6px;color:#d9c7a5;border-bottom:1px dashed var(--line);padding-bottom:4px}.case-file p{white-space:pre-wrap}.case-subtitle{color:var(--muted);margin-top:0}.case-stamp{display:inline-block;border:1px solid var(--accent);color:var(--accent);padding:3px 8px;border-radius:4px;font-size:11px;letter-spacing:.12em;transform:rotate(-1deg)}.briefing-list{margin:6px 0 0;padding-left:24px}.briefing-list li{margin:5px 0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.table th{color:var(--accent)}
.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}.toast{width:min(360px,calc(100vw - 32px));padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#151d25;box-shadow:var(--shadow);font-size:13px}.toast.ok{border-color:#3d6d4b}.toast.warn{border-color:#765a2f}.toast.danger{border-color:#73393d}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;top:54px;bottom:0;left:0;width:min(330px,88vw);z-index:30;box-shadow:var(--shadow)}.main{grid-column:1}.grid,.grid.three,.grid.four{grid-template-columns:1fr}.topbar{grid-column:1}.status-pill.optional{display:none}}

/* v1.2：职业技能构筑与模组目录 */
.scenario-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.scenario-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.scenario-card{display:flex;flex-direction:column;gap:10px;min-height:260px}.scenario-card h2{margin:0}.scenario-meta{display:flex;flex-wrap:wrap;gap:6px}.tag{display:inline-flex;border:1px solid #45576a;background:#101820;border-radius:999px;padding:3px 7px;color:#b9c7d4;font-size:11px}.tag.accent{border-color:#806a45;color:#e8cc99}.scenario-card .row{margin-top:auto}.compat{font-size:12px;line-height:1.6}.compat.good{color:var(--ok)}.compat.warn{color:var(--warn)}
.occupation-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.summary-box{border:1px solid var(--line);background:#0d141a;border-radius:9px;padding:9px}.summary-box span{display:block;color:var(--muted);font-size:11px}.summary-box b{display:block;margin-top:3px}.choice-panel{border:1px dashed #485867;border-radius:10px;padding:12px;margin:10px 0;background:#0e151b}.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.skill-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.skill-toolbar .field{margin:0;min-width:170px}.skill-table-wrap{overflow:auto;max-height:600px;border:1px solid var(--line);border-radius:10px}.skill-table{width:100%;border-collapse:collapse;font-size:12px;min-width:850px}.skill-table th{position:sticky;top:0;z-index:2;background:#17212b;color:var(--accent);padding:8px;border-bottom:1px solid var(--line);text-align:left}.skill-table td{padding:6px 8px;border-bottom:1px solid #25313d}.skill-table tr.occupation-row{background:rgba(116,92,50,.13)}.skill-table tr.invalid-row{background:rgba(122,45,51,.18)}.skill-table input{width:74px;padding:6px;text-align:center}.skill-table input:disabled{background:#0a0f14;color:#596570}.skill-name{min-width:150px}.skill-name small{display:block;color:var(--muted)}.skill-final{font-weight:800;font-size:14px}.skill-cap{color:var(--muted)}.point-status{position:sticky;bottom:0;background:#111820;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;box-shadow:0 -8px 24px #0005}.point-status .bad{color:var(--danger)}.point-status .good{color:var(--ok)}.allocation-note{font-size:12px;color:var(--muted);line-height:1.6}.kbd{border:1px solid #52606d;background:#0a1015;border-radius:5px;padding:1px 5px;font-size:11px;color:#dce4eb}
@media(max-width:900px){.scenario-grid{grid-template-columns:1fr}.scenario-filters,.occupation-summary,.choice-grid,.point-status{grid-template-columns:1fr}}

</style>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button id="toggleSidebar" class="icon-btn" type="button">☰</button>
    <div class="brand">TRPG / 调查档案</div>
    <div id="topSlot" class="status-pill">未建档</div>
    <div id="topSystem" class="status-pill optional">系统：未选择</div>
    <div id="topPhase" class="status-pill">阶段：setup</div>
    <div id="topConnection" class="status-pill optional">API：未测试</div>
    <div class="top-actions">
      <button type="button" data-nav="setup">配置</button>
      <button type="button" data-nav="character">角色</button>
      <button type="button" data-nav="scenario">剧本</button>
      <button type="button" data-nav="chat">跑团</button>
      <button type="button" data-nav="saves">存档</button>
    </div>
  </header>

  <aside id="sidebar" class="sidebar"></aside>

  <main class="main">
    <section id="view-setup" class="view active"></section>
    <section id="view-character" class="view"></section>
    <section id="view-scenario" class="view"></section>
    <section id="view-chat" class="view chat-view"></section>
    <section id="view-saves" class="view"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastWrap" class="toast-wrap"></div>
<input id="scenarioFileInput" class="hidden" type="file" accept=".txt,.md,text/plain,text/markdown">
<input id="saveFileInput" class="hidden" type="file" accept=".json,application/json">

  const cf=$("#characterForm");if(cf){if(state.config.system==="coc7")bindCocCharacterControls(cf);cf.onsubmit=e=>{e.preventDefault();try{const f=new FormData(cf),old=state.character?deepClone(state.character):null;state.character=state.config.system==="coc7"?buildCocCharacter(f):state.config.system==="dnd5e"?buildDndCharacter(f):buildCustomCharacter(f);setPhase(state.scenario?"awaiting_player_action":"character_ready",{force:true});bumpRevision();addLog("character",old?`用户手动修正角色：${old.name} → ${state.character.name}`:`创建角色：${state.character.name}`);addMessage("system",old?"角色档案已手动修正，修改已记录。":`角色已创建：${state.character.name}`);renderAll();showView(state.scenario?"chat":"scenario")}catch(error){toast(error.message,"danger",5000)}}}
  $$("[data-preview-scenario]").forEach(button=>button.onclick=()=>{const scenario=SCENARIO_LIBRARY.find(item=>item.id===button.dataset.previewScenario);if(scenario)showScenarioBriefingModal(scenario)});$$('[data-load-scenario]').forEach(button=>button.onclick=()=>{const scenario=SCENARIO_LIBRARY.find(item=>item.id===button.dataset.loadScenario);if(scenario)showScenarioBriefingModal(scenario,{confirmLoad:true})});
  const currentBriefing=$("#showCurrentBriefingBtn");if(currentBriefing)currentBriefing.onclick=()=>showScenarioBriefingModal(state.scenario);const applyScenarioFilters=()=>{const era=$("#scenarioEraFilter")?.value||"all",difficulty=$("#scenarioDifficultyFilter")?.value||"all",theme=$("#scenarioThemeFilter")?.value||"all";$$('.scenario-card').forEach(card=>{const show=(era==="all"||card.dataset.era===era)&&(difficulty==="all"||card.dataset.difficulty===difficulty)&&(theme==="all"||(card.dataset.themes||"").split("|").includes(theme));card.classList.toggle("hidden",!show)})};["scenarioEraFilter","scenarioDifficultyFilter","scenarioThemeFilter"].forEach(id=>$("#"+id)?.addEventListener("change",applyScenarioFilters));
  const chatBriefing=$("#chatBriefingBtn");if(chatBriefing)chatBriefing.onclick=()=>showScenarioBriefingModal(state.scenario);
  const improv=$("#useImprovBtn");if(improv)improv.onclick=()=>{const s={id:uid("scenario"),title:"AI 即兴调查",mode:"improv",system:state.config.system,chapters:[{id:"chapter-improv",title:"即兴章节",scenes:[{id:"scene-improv",title:"即兴场景",nodes:[{id:"node-improv-start",title:"开场",background:state.config.worldBackground||"故事从此开始。",goals:[],clues:[],npcs:[],mandatoryChecks:[],optionalChecks:[],exits:[],rawText:""}]}]}]};activateScenario(s);showView(state.character?"chat":"character")};
  const importBtn=$("#importScenarioBtn");if(importBtn)importBtn.onclick=()=>$("#scenarioFileInput").click();
  const send=$("#sendActionBtn");if(send)send.onclick=()=>submitPlayerAction($("#playerAction").value).then(success=>{if(success)$("#playerAction").value=""}).catch(e=>toast(e.message,"danger"));
  const input=$("#playerAction");if(input)input.onkeydown=e=>{if(e.key!=="Enter"||e.shiftKey||e.isComposing||e.keyCode===229)return;e.preventDefault();if(!send.disabled&&input.value.trim())send.click()};
  const cancel=$("#cancelRequestBtn");if(cancel)cancel.onclick=cancelActiveRequest;const retry=$("#retryContinuationBtn");if(retry)retry.onclick=()=>retryContinuation().catch(e=>toast(e.message,"danger"));
  const summarize=$("#summarizeBtn");if(summarize)summarize.onclick=()=>{if(confirm("整理上下文会调用一次 API，但不会删除本地完整日志。继续吗？"))summarizeContext(true).catch(e=>toast(e.message,"danger"))};
  const saveBtn=$("#saveNowBtn");if(saveBtn)saveBtn.onclick=()=>{state.saveMeta.slotName=asString($("#slotNameInput").value,80)||"未命名调查";saveCurrentSlot()};
  const newSlot=$("#newSlotBtn");if(newSlot)newSlot.onclick=()=>{state.saveMeta.slotId=null;state.saveMeta.slotName=asString($("#slotNameInput").value,80)||`${state.saveMeta.slotName} 副本`;state.saveMeta.createdAt=null;saveCurrentSlot();renderAll()};
  const exportBtn=$("#exportSaveBtn");if(exportBtn)exportBtn.onclick=exportCurrentSave;const importSave=$("#importSaveBtn");if(importSave)importSave.onclick=()=>$("#saveFileInput").click();
  $$('[data-load-slot]').forEach(b=>b.onclick=()=>{try{loadSlot(b.dataset.loadSlot)}catch(e){toast(e.message,"danger")}});$$('[data-delete-slot]').forEach(b=>b.onclick=()=>{if(confirm("删除后无法恢复，确认删除？"))deleteSlot(b.dataset.deleteSlot)});
  $$('[data-modal-close]').forEach(b=>b.onclick=closeModal);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const action=b.dataset.action;try{if(action==="roll-check")resolvePendingCheck().catch(err=>toast(err.message,"danger"));else if(action==="skip-check")resolvePendingCheck({skip:true}).catch(err=>toast(err.message,"danger"));else if(action==="confirm-node")confirmNodeProposal();else if(action==="reject-node")rejectNodeProposal()}catch(err){toast(err.message,"danger")}});
$$('[data-nav]').forEach(b=>b.addEventListener("click",()=>showView(b.dataset.nav)));
$("#toggleSidebar").addEventListener("click",()=>{$("#sidebar").classList.toggle("collapsed");$("#app").classList.toggle("sidebar-collapsed")});
$("#scenarioFileInput").addEventListener("change",async e=>{const file=e.target.files?.[0];e.target.value="";if(!file)return;if(file.size>2_000_000){toast("文件超过 2MB 限制","danger");return}try{const raw=await file.text();if(raw.includes("\uFFFD"))throw new Error("文件可能不是 UTF-8 编码，请转换为 UTF-8 后重试");const scenario=parseScenarioText(raw,file.name.replace(/\.(txt|md)$/i,""));showScenarioPreview(raw,scenario,file.name)}catch(err){toast(`剧本导入失败：${err.message}`,"danger")}});
$("#saveFileInput").addEventListener("change",async e=>{const file=e.target.files?.[0];e.target.value="";if(!file)return;if(file.size>8_000_000){toast("存档超过 8MB 限制","danger");return}try{const text=await file.text();if(text.includes("\uFFFD"))throw new Error("文件可能不是 UTF-8 编码");const p=safeJsonParse(text);if(!p.ok)throw new Error("JSON 解析失败");const errors=validateImportedSave(p.value);if(errors.length)throw new Error(errors.join("；"));showSavePreview(p.value)}catch(err){toast(`存档导入失败：${err.message}`,"danger")}});
window.addEventListener("beforeunload",()=>{if(state.runtime.isDirty)try{saveCurrentSlot({silent:true})}catch{}});

/* =========================
   初始化
========================= */
window.__TRPG_TEST_API__={APP_VERSION,SCHEMA_VERSION,COC_SKILL_DEFINITIONS,COC_OCCUPATIONS,SCENARIO_LIBRARY,validateScenario,calculateOccupationPoints,getCocSkillBase,getOccupationSkillIds,validateOccupationSelections,cocRank,parseDiceExpression,normalizeLoadedState,parseScenarioText};
function init(){
  const last=getSaveIndex()[0];if(last){try{loadSlot(last.slotId);return}catch(error){console.warn("自动载入失败",error)}}
  const prefs=safeJsonParse(localStorage.getItem(STORAGE_PREFS_KEY)||"{}");if(prefs.ok&&isPlainObject(prefs.value))state.config={...state.config,...prefs.value};sanitizeRuntimeAfterLoad();renderAll();
}
init();
</script>
