name: TV Browser Lite - Android CI

on:
  push:
    branches: [main]
    paths:
      - "tv-browser-lite/**"
      - ".github/workflows/tv-browser-lite-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tv-browser-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test and assemble independent APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: APK checksum
        if: success()
        run: sha256sum app/build/outputs/apk/debug/*.apk
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tv-browser-lite-debug-apk
          path: tv-browser-lite/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
