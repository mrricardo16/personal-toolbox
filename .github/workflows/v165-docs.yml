name: Finalize TRPG v1.6.5 Documentation

on:
  push:
    branches:
      - agent/v1.6.5-hp-damage-state

permissions:
  contents: write

jobs:
  docs:
    if: github.event.head_commit.message == 'Run v1.6.5 documentation finalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README for v1.6.5
        env:
          V165_SECTION_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('trpg-dm-assistant/README.md')
          s=p.read_text()
          section=base64.b64decode(os.environ['V165_SECTION_B64']).decode('utf-8')
          s=s.replace('# TRPG AI 主持助手 v1.6.4','# TRPG AI 主持助手 v1.6.5',1)
          s=s.replace('当前版本为 v1.6.4。','当前版本为 v1.6.5。',1)
          marker='## v1.6.4 更新内容'
          if marker not in s:
              raise SystemExit('README v1.6.4 marker not found')
          s=s.replace(marker,section+marker,1)
          p.write_text(s)
          PY
      - name: Persist documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/README.md
          git commit -m "Document TRPG DM Assistant v1.6.5 HP damage state"
          git push origin HEAD:agent/v1.6.5-hp-damage-state
