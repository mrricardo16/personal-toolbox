name: Persist v1.6.2 Transaction Expectation Correction

on:
  push:
    branches:
      - agent/v1.6.2-failure-forward-cost-engine

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Persist v1.6.2 transaction expectation correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct net progress expectation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const file='trpg-dm-assistant/build/test-v162-failure-forward-cost-engine.js';
          let s=fs.readFileSync(file,'utf8');
          const old='assert.equal(tx.prepared.draft.campaign.directorState.progress,3);assert.equal(tx.prepared.draft.campaign.directorState.tension,2)';
          const next='assert.equal(tx.prepared.draft.campaign.directorState.progress,6);assert.equal(tx.prepared.draft.campaign.directorState.tension,2)';
          if(!s.includes(old))throw new Error('target expectation not found');
          s=s.replace(old,next);
          fs.writeFileSync(file,s,'utf8');
          NODE
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/build/test-v162-failure-forward-cost-engine.js
          git commit -m "Correct v1.6.2 net progress expectation"
          git push origin HEAD:agent/v1.6.2-failure-forward-cost-engine
