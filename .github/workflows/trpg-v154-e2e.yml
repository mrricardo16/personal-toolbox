name: One-shot TRPG v1.5.4 Real API E2E

on:
  push:
    branches:
      - tmp-v154-e2e
    paths:
      - '.github/workflows/trpg-v154-e2e.yml'
      - '.github/scripts/trpg-v154-fix-harness-loader.js'
      - '.github/scripts/trpg-v154-product-patch.js'
      - '.github/scripts/trpg-v154-npc-materialization-patch.js'
      - 'trpg-dm-assistant/build/test-real-api-v154-e2e.js'
      - 'trpg-dm-assistant/build/test-v154-protocol-routing.js'
      - 'trpg-dm-assistant/build/test-v154-npc-materialization.js'
      - 'trpg-dm-assistant/src/**'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v154-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply v1.5.4 protocol hardening
        run: node .github/scripts/trpg-v154-product-patch.js

      - name: Apply v1.5.4 NPC materialization fix
        run: node .github/scripts/trpg-v154-npc-materialization-patch.js

      - name: Deterministic preflight
        shell: bash
        run: |
          node trpg-dm-assistant/build/test-security-hardening.js
          node trpg-dm-assistant/build/test-save-ui.js
          node trpg-dm-assistant/build/test-coc-outcomes.js
          node trpg-dm-assistant/build/test-situation-ui.js
          node trpg-dm-assistant/build/test-ai-json-repair.js
          node trpg-dm-assistant/build/test-v150-experience.js
          node trpg-dm-assistant/build/test-v151-investigation-stability.js
          node trpg-dm-assistant/build/test-v152-long-session.js
          node trpg-dm-assistant/build/test-v153-clue-routes.js
          node trpg-dm-assistant/build/test-v154-protocol-routing.js
          node trpg-dm-assistant/build/test-v154-npc-materialization.js
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          git diff --check

      - name: Match browser script loading semantics
        run: node .github/scripts/trpg-v154-fix-harness-loader.js

      - name: Real API full-case E2E burn
        env:
          TRPG_TEST_API_KEY: ${{ secrets.DS_KEY }}
          TRPG_TEST_API_URL: https://api.deepseek.com/chat/completions
          TRPG_TEST_MODEL: deepseek-v4-flash
          TRPG_TEST_ROUNDS: '30'
          TRPG_E2E_SEED: '154'
          TRPG_E2E_ARTIFACT_DIR: trpg-dm-assistant/e2e-artifacts
        run: |
          test -n "$TRPG_TEST_API_KEY"
          node trpg-dm-assistant/build/test-real-api-v154-e2e.js

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trpg-v154-e2e-report
          path: trpg-dm-assistant/e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14
