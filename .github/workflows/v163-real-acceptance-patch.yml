name: Patch v1.6.3 Real Provider Acceptance

on:
  push:
    branches:
      - agent/v1.6.3-san-loss-resolution

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run v1.6.3 real acceptance patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch acceptance
        run: node trpg-dm-assistant/build/patch-v163-real-acceptance.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/build/test-real-api-v1513.js
          git commit -m "Accept bounded provider-deferred ending in real E2E"
          git push origin HEAD:agent/v1.6.3-san-loss-resolution

# one-shot
