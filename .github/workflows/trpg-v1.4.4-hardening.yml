name: TRPG v1.4.4 strict hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trpg-v1.4.4-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Correct patch target
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('trpg-dm-assistant/build/apply-v1.4.4.py')
          text = path.read_text(encoding='utf-8')
          old_head = "scenario_path = ROOT / 'src/scenario-engine.js'\nscenario = read(scenario_path)"
          new_head = "memory_path = ROOT / 'src/memory.js'\nmemory = read(memory_path)"
          old_tail = "scenario = replace_between(scenario, 'async function runApiProtocolSelfCheck(', 'function applyEnding', selfcheck, '真实 API 协议自检')\nwrite(scenario_path, scenario)"
          new_tail = "memory = replace_between(memory, 'async function runApiProtocolSelfCheck(', 'function applyEnding', selfcheck, '真实 API 协议自检')\nwrite(memory_path, memory)"
          if old_head not in text or old_tail not in text:
              raise RuntimeError('无法定位协议自检补丁目标')
          path.write_text(text.replace(old_head,new_head,1).replace(old_tail,new_tail,1),encoding='utf-8')
          PY

      - name: Apply strict hardening patch
        run: python3 trpg-dm-assistant/build/apply-v1.4.4.py

      - name: Run real behavior tests
        run: node trpg-dm-assistant/build/test-security-hardening.js

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)

      - name: Build, verify and check determinism
        shell: bash
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          test "$(find trpg-dm-assistant -type f -name '*.html' | wc -l)" -eq 1
          git diff --check

      - name: Remove one-time patch files
        run: |
          rm trpg-dm-assistant/build/apply-v1.4.4.py
          rm .github/workflows/trpg-v1.4.4-hardening.yml

      - name: Commit v1.4.4 to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/trpg-ci.yml trpg-dm-assistant
          git add -u .github/workflows/trpg-v1.4.4-hardening.yml
          git commit -m 'Harden TRPG security and protocol runtime v1.4.4'
          git push origin HEAD:main
