name: TRPG DM Assistant CI

on:
  push:
    branches: [main]
    paths:
      - 'trpg-dm-assistant/**'
      - '.github/workflows/trpg-ci.yml'
  pull_request:
    paths:
      - 'trpg-dm-assistant/**'
      - '.github/workflows/trpg-ci.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Runtime security and protocol tests
        run: node trpg-dm-assistant/build/test-security-hardening.js

      - name: Save management interaction regression
        run: node trpg-dm-assistant/build/test-save-ui.js

      - name: CoC outcome regression
        run: node trpg-dm-assistant/build/test-coc-outcomes.js

      - name: Situation sidebar regression
        run: node trpg-dm-assistant/build/test-situation-ui.js

      - name: AI JSON repair corpus
        run: node trpg-dm-assistant/build/test-ai-json-repair.js

      - name: v1.5.0 experience regression
        run: node trpg-dm-assistant/build/test-v150-experience.js

      - name: v1.5.1 investigation stability regression
        run: node trpg-dm-assistant/build/test-v151-investigation-stability.js

      - name: v1.5.2 long-session regression
        run: node trpg-dm-assistant/build/test-v152-long-session.js

      - name: v1.5.3 clue-route regression
        run: node trpg-dm-assistant/build/test-v153-clue-routes.js

      - name: v1.5.4 protocol routing regression
        run: node trpg-dm-assistant/build/test-v154-protocol-routing.js

      - name: v1.5.4 NPC materialization regression
        run: node trpg-dm-assistant/build/test-v154-npc-materialization.js

      - name: v1.5.4 location alias regression
        run: node trpg-dm-assistant/build/test-v154-location-alias.js

      - name: v1.5.4 empty-response retry regression
        run: node trpg-dm-assistant/build/test-v154-empty-response-retry.js

      - name: v1.5.4 operation ID alias regression
        run: node trpg-dm-assistant/build/test-v154-operation-id-alias.js

      - name: v1.5.5 location transition alias regression
        run: node trpg-dm-assistant/build/test-v155-location-transition-alias.js

      - name: v1.5.6 player assertion guard regression
        run: node trpg-dm-assistant/build/test-v156-player-assertion-guard.js

      - name: JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)

      - name: Build and verify
        shell: bash
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          test "$(find trpg-dm-assistant -type f -name '*.html' | wc -l)" -eq 1
          git diff --exit-code -- trpg-dm-assistant/outputs/trpg-dm-assistant.html
          git diff --check
