name: Finalize TRPG v1.6.3 Documentation and Cleanup

on:
  push:
    branches:
      - agent/v1.6.3-san-loss-resolution

permissions:
  contents: write

jobs:
  docs:
    if: github.event.head_commit.message == 'Run v1.6.3 docs and cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch README
        run: node trpg-dm-assistant/build/patch-v163-docs.js
      - name: Verify v1.6.3 release documentation
        shell: bash
        run: |
          grep -q '# TRPG AI 主持助手 v1.6.3' trpg-dm-assistant/README.md
          grep -q '613 PASS / 0 FAIL' trpg-dm-assistant/README.md
          grep -q 'SAN Loss Resolution' trpg-dm-assistant/README.md
          grep -q 'APP_VERSION = "1.6.3"' trpg-dm-assistant/src/scenarios/library.js
          grep -q 'SAN_LOSS_RESOLUTION_VERSION="1.0"' trpg-dm-assistant/src/san-loss-resolution.js
          test -f trpg-dm-assistant/reports/trpg-dm-assistant-v1.6.3-test-report.md
          git diff --check
      - name: Commit README and remove release scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/README.md
          git rm --ignore-unmatch \
            .github/workflows/v163-validate.yml \
            .github/workflows/v163-docs-cleanup.yml \
            trpg-dm-assistant/build/patch-v163-release.js \
            trpg-dm-assistant/build/patch-v163-real-acceptance.js \
            trpg-dm-assistant/build/patch-v163-docs.js
          git commit -m "Finalize TRPG DM Assistant v1.6.3 release files"
          git push origin HEAD:agent/v1.6.3-san-loss-resolution
