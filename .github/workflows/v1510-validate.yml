name: Validate TRPG v1.5.10 Authored Threat Clock

on:
  push:
    branches:
      - agent/v1.5.10-authored-threat-clock

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare v1.5.10 release wiring
        run: node trpg-dm-assistant/build/patch-v1510-release.js

      - name: Align v1.5.10 fixture with addItem contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const file='trpg-dm-assistant/build/test-v1510-authored-threat-clock.js';
          let text=fs.readFileSync(file,'utf8');
          text=text.replace('{operation:"addItem",id:"safe-item",name:"合法物品",quantity:1}','{operation:"addItem",itemId:"safe-item",name:"合法物品",quantity:1}');
          if(!text.includes('itemId:"safe-item"'))throw new Error('addItem fixture patch failed');
          fs.writeFileSync(file,text,'utf8');
          NODE

      - name: v1.5.10 authored threat clock regression
        run: node trpg-dm-assistant/build/test-v1510-authored-threat-clock.js

      - name: Relevant historical regressions
        run: |
          node trpg-dm-assistant/build/test-v159-progress-semantics.js
          node trpg-dm-assistant/build/test-v158-api-response-resilience.js
          node trpg-dm-assistant/build/test-v157-case-integrity.js
          node trpg-dm-assistant/build/test-v157-canonical-assertion-state.js

      - name: JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)

      - name: Build and verify
        shell: bash
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          test "$(find trpg-dm-assistant -type f -name '*.html' | wc -l)" -eq 1
          git diff --check

      - name: Commit validated release wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/src/scenarios/library.js \
                  trpg-dm-assistant/src/authored-threat-clock.js \
                  trpg-dm-assistant/build/build-single-html.js \
                  trpg-dm-assistant/build/verify-single-html.js \
                  trpg-dm-assistant/build/test-v159-progress-semantics.js \
                  trpg-dm-assistant/build/test-v1510-authored-threat-clock.js \
                  trpg-dm-assistant/outputs/trpg-dm-assistant.html
          if git diff --cached --quiet; then
            echo "Release wiring already synchronized"
          else
            git commit -m "Finalize TRPG DM Assistant v1.5.10 wiring"
            git push origin HEAD:agent/v1.5.10-authored-threat-clock
          fi
