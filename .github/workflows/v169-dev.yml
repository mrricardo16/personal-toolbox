name: TRPG v1.6.9 Development Gate

on:
  push:
    branches: [agent/v1.6.9-combat-damage]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip v169-dev]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply narrow source and harness repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('trpg-dm-assistant/src/combat-damage.js')
          s=p.read_text(encoding='utf-8')
          old='aiAuthority:"cannot_roll_or_commit_combat_damage"}\n\n/* Extend combat participants'
          new='aiAuthority:"cannot_roll_or_commit_combat_damage"}\n}\n\n/* Extend combat participants'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('expected Combat Damage context boundary not found')

          t=Path('trpg-dm-assistant/build/test-v169-combat-damage.js')
          x=t.read_text(encoding='utf-8')
          helper_old='weapon:{id:`${id}-weapon`,label:`${id}武器`,damage:weaponDamage'
          helper_new='weapon:{id:String(id)+"-weapon",label:String(id)+"武器",damage:weaponDamage'
          if helper_old in x:
              x=x.replace(helper_old,helper_new,1)
          elif helper_new not in x:
              raise SystemExit('expected v1.6.9 test helper boundary not found')
          expect_old='assert.equal(out.damage.weaponResult.total,1);assert.equal(out.damage.damageBonusResult.total,1);assert.equal(out.damage.grossDamage,2)'
          expect_new='assert.equal(out.damage.weaponResult.total,2);assert.equal(out.damage.damageBonusResult.total,1);assert.equal(out.damage.grossDamage,3)'
          if expect_old in x:
              x=x.replace(expect_old,expect_new,1)
          elif expect_new not in x:
              raise SystemExit('expected Fight Back damage assertion boundary not found')
          t.write_text(x,encoding='utf-8')
          PY
      - name: Syntax
        run: |
          node --check trpg-dm-assistant/src/combat-damage.js
          node --check trpg-dm-assistant/build/test-v169-combat-damage.js
      - name: v1.6.9 focused regression
        run: node trpg-dm-assistant/build/test-v169-combat-damage.js
      - name: v1.6.8 compatibility regression
        run: node trpg-dm-assistant/build/test-v168-combat-opposed.js
      - name: Build and verify
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          git diff --check
      - name: Persist validated source, test and product
        run: |
          if ! git diff --quiet -- trpg-dm-assistant/src/combat-damage.js trpg-dm-assistant/build/test-v169-combat-damage.js trpg-dm-assistant/outputs/trpg-dm-assistant.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trpg-dm-assistant/src/combat-damage.js trpg-dm-assistant/build/test-v169-combat-damage.js trpg-dm-assistant/outputs/trpg-dm-assistant.html
            git commit -m "Fix and build v1.6.9 combat damage [skip v169-dev]"
            git push
          fi
