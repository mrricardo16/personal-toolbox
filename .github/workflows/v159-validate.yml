name: Validate TRPG v1.5.9 Progress Semantics

on:
  push:
    branches:
      - agent/v1.5.9-progress-semantics

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare v1.5.9 release wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          library=Path('trpg-dm-assistant/src/scenarios/library.js')
          text=library.read_text(encoding='utf-8')
          if 'const APP_VERSION = "1.5.8";' in text:
              text=text.replace('const APP_VERSION = "1.5.8";','const APP_VERSION = "1.5.9";',1)
          assert 'const APP_VERSION = "1.5.9";' in text
          library.write_text(text,encoding='utf-8')

          build=Path('trpg-dm-assistant/build/build-single-html.js')
          text=build.read_text(encoding='utf-8')
          if '"progress-semantics.js"' not in text:
              text=text.replace('  "api-response-resilience.js"\n];','  "api-response-resilience.js",\n  "progress-semantics.js"\n];',1)
          assert '"progress-semantics.js"' in text
          build.write_text(text,encoding='utf-8')

          verify=Path('trpg-dm-assistant/build/verify-single-html.js')
          text=verify.read_text(encoding='utf-8')
          if '"src/progress-semantics.js"' not in text:
              text=text.replace('  "src/api-response-resilience.js",','  "src/api-response-resilience.js",\n  "src/progress-semantics.js",',1)
          assert '"src/progress-semantics.js"' in text
          verify.write_text(text,encoding='utf-8')

          test=Path('trpg-dm-assistant/build/test-v159-progress-semantics.js')
          text=test.read_text(encoding='utf-8')
          text=text.replace('"saves.js","ui.js","api-response-resilience.js","progress-semantics.js"','"saves.js","progress-semantics.js"',1)
          old='document:{querySelector(){return null},querySelectorAll(){return[]},createElement:node,body:{appendChild(){}}}'
          new='document:{addEventListener(){},querySelector(){return null},querySelectorAll(){return[]},createElement:node,body:{appendChild(){}}}'
          if old in text:
              text=text.replace(old,new,1)
          assert '"saves.js","progress-semantics.js"' in text
          test.write_text(text,encoding='utf-8')

          v158=Path('trpg-dm-assistant/build/test-v158-api-response-resilience.js')
          text=v158.read_text(encoding='utf-8')
          old='assert.equal(api.APP_VERSION,"1.5.8");assert.equal(api.SCHEMA_VERSION,8);'
          new='const v=api.APP_VERSION.split(".").map(Number);assert(v[0]>1||v[0]===1&&(v[1]>5||v[1]===5&&v[2]>=8));assert.equal(api.SCHEMA_VERSION,8);'
          if old in text:
              text=text.replace(old,new,1)
          assert new in text
          text=text.replace('版本升级为 v1.5.8 且 Schema/协议不变','版本不低于 v1.5.8 且 Schema/协议不变',1)
          v158.write_text(text,encoding='utf-8')

          ci=Path('.github/workflows/trpg-ci.yml')
          text=ci.read_text(encoding='utf-8')
          marker='      - name: JavaScript syntax\n'
          block='      - name: v1.5.9 progress semantics regression\n        run: node trpg-dm-assistant/build/test-v159-progress-semantics.js\n\n'
          if block not in text:
              assert marker in text
              text=text.replace(marker,block+marker,1)
          ci.write_text(text,encoding='utf-8')
          PY

      - name: v1.5.9 deterministic regression
        run: node trpg-dm-assistant/build/test-v159-progress-semantics.js

      - name: Relevant historical regressions
        run: |
          node trpg-dm-assistant/build/test-v157-case-integrity.js
          node trpg-dm-assistant/build/test-v157-canonical-assertion-state.js
          node trpg-dm-assistant/build/test-v158-api-response-resilience.js

      - name: JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)

      - name: Build and verify
        shell: bash
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          test "$(find trpg-dm-assistant -type f -name '*.html' | wc -l)" -eq 1
          git diff --check

      - name: Commit validated release wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/src/scenarios/library.js \
                  trpg-dm-assistant/build/build-single-html.js \
                  trpg-dm-assistant/build/verify-single-html.js \
                  trpg-dm-assistant/build/test-v158-api-response-resilience.js \
                  trpg-dm-assistant/build/test-v159-progress-semantics.js \
                  trpg-dm-assistant/outputs/trpg-dm-assistant.html \
                  .github/workflows/trpg-ci.yml
          if git diff --cached --quiet; then
            echo "Release wiring already synchronized"
          else
            git commit -m "Finalize TRPG DM Assistant v1.5.9 wiring"
            git push origin HEAD:agent/v1.5.9-progress-semantics
          fi
