name: Validate TRPG v1.6 Documentation

on:
  push:
    branches:
      - agent/v1.6.0-coc-resolution-engine

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Patch README for v1.6.0
        run: node trpg-dm-assistant/build/patch-v160-docs.js

      - name: Verify v1.6 release state
        shell: bash
        run: |
          node trpg-dm-assistant/build/test-v160-coc-resolution-engine.js
          node trpg-dm-assistant/build/test-v160-coc-resolution-diagnostics.js
          node trpg-dm-assistant/build/test-v160-transport-abort-classification.js
          node trpg-dm-assistant/build/test-v1513-full-case-e2e.js
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          git diff --exit-code -- trpg-dm-assistant/outputs/trpg-dm-assistant.html
          git diff --check

      - name: Commit README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trpg-dm-assistant/README.md
          if git diff --cached --quiet; then
            echo "README already synchronized"
          else
            git commit -m "Document TRPG DM Assistant v1.6.0"
            git push origin HEAD:agent/v1.6.0-coc-resolution-engine
          fi
