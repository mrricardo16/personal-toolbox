name: Apply TRPG v1.5.6 Player Assertion Guard

on:
  push:
    branches:
      - agent/v1.5.6-player-assertion-guard
    paths:
      - 'trpg-dm-assistant/build/apply-v156-player-assertion-guard.js'
      - '.github/workflows/v156-apply.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.5.6-player-assertion-guard
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply v1.5.6 source changes
        run: |
          node trpg-dm-assistant/build/apply-v156-player-assertion-guard.js
          node -e 'const fs=require("fs"),p="trpg-dm-assistant/src/player-action-guard.js";let s=fs.readFileSync(p,"utf8");s=s.replace("【】[]“”","【】“”");fs.writeFileSync(p,s,"utf8")'
          python3 - <<'PY'
          from pathlib import Path
          p=Path("trpg-dm-assistant/src/player-action-guard.js")
          lines=p.read_text(encoding="utf-8").splitlines()
          replacement=r'''function playerGuardEscape(value){let out="";for(const char of String(value||""))out+="\\^$.*+?()[]{}|".includes(char)?"\\"+char:char;return out}'''
          lines=[replacement if line.startswith("function playerGuardEscape(value)") else line for line in lines]
          p.write_text("\n".join(lines)+"\n",encoding="utf-8")
          test_path=Path("trpg-dm-assistant/build/test-v156-player-assertion-guard.js")
          test_text=test_path.read_text(encoding="utf-8")
          test_text=test_text.replace('assert(/本轮只解决 steps[0]/.test(text))','assert(text.includes("本轮只解决 steps[0]"))')
          test_path.write_text(test_text,encoding="utf-8")
          PY
          sed -i 's/23 PASS \/ 0 FAIL/25 PASS \/ 0 FAIL/g; s/223 PASS \/ 0 FAIL/225 PASS \/ 0 FAIL/g; s/v1.5.5 的 200 + 本版 23/v1.5.5 的 200 + 本版 25/g; s/新增 23 条 v1.5.6/新增 25 条 v1.5.6/g' trpg-dm-assistant/README.md trpg-dm-assistant/reports/trpg-dm-assistant-v1.5.6-test-report.md
          sed -i 's/assert.equal(api.APP_VERSION,"1.5.5")/assert.ok(Number(api.APP_VERSION.split(".")[2])>=5)/' trpg-dm-assistant/build/test-v155-location-transition-alias.js

      - name: Runtime security and protocol tests
        run: node trpg-dm-assistant/build/test-security-hardening.js

      - name: Save management interaction regression
        run: node trpg-dm-assistant/build/test-save-ui.js

      - name: CoC outcome regression
        run: node trpg-dm-assistant/build/test-coc-outcomes.js

      - name: Situation sidebar regression
        run: node trpg-dm-assistant/build/test-situation-ui.js

      - name: AI JSON repair corpus
        run: node trpg-dm-assistant/build/test-ai-json-repair.js

      - name: v1.5.0 experience regression
        run: node trpg-dm-assistant/build/test-v150-experience.js

      - name: v1.5.1 investigation stability regression
        run: node trpg-dm-assistant/build/test-v151-investigation-stability.js

      - name: v1.5.2 long-session regression
        run: node trpg-dm-assistant/build/test-v152-long-session.js

      - name: v1.5.3 clue-route regression
        run: node trpg-dm-assistant/build/test-v153-clue-routes.js

      - name: v1.5.4 protocol routing regression
        run: node trpg-dm-assistant/build/test-v154-protocol-routing.js

      - name: v1.5.4 NPC materialization regression
        run: node trpg-dm-assistant/build/test-v154-npc-materialization.js

      - name: v1.5.4 location alias regression
        run: node trpg-dm-assistant/build/test-v154-location-alias.js

      - name: v1.5.4 empty-response retry regression
        run: node trpg-dm-assistant/build/test-v154-empty-response-retry.js

      - name: v1.5.4 operation ID alias regression
        run: node trpg-dm-assistant/build/test-v154-operation-id-alias.js

      - name: v1.5.5 location transition alias regression
        run: node trpg-dm-assistant/build/test-v155-location-transition-alias.js

      - name: v1.5.6 player assertion guard regression
        run: node trpg-dm-assistant/build/test-v156-player-assertion-guard.js

      - name: JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find trpg-dm-assistant/src trpg-dm-assistant/build -name '*.js' -print0)

      - name: Build and verify
        shell: bash
        run: |
          node trpg-dm-assistant/build/build-single-html.js
          node trpg-dm-assistant/build/verify-single-html.js
          first=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          node trpg-dm-assistant/build/build-single-html.js
          second=$(sha256sum trpg-dm-assistant/outputs/trpg-dm-assistant.html | cut -d' ' -f1)
          test "$first" = "$second"
          test "$(find trpg-dm-assistant -type f -name '*.html' | wc -l)" -eq 1
          git diff --check

      - name: Commit validated product changes
        shell: bash
        run: |
          git checkout -- .github/workflows/trpg-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A trpg-dm-assistant
          git diff --cached --check
          git commit -m "Release TRPG DM Assistant v1.5.6"
          git push origin HEAD:agent/v1.5.6-player-assertion-guard
